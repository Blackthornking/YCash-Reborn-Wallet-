name: Build Native YCash Core

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  native-core:
    name: Compile and Test Native YCash Core
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: phase48/ycash_core

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Show Rust version
        run: |
          rustc --version
          cargo --version

      - name: Verify YCash upstream sources
        run: |
          echo "Checking vendored dependencies..."

          test -d ../vendor/librustzcash-nu61
          test -d ../vendor/sapling-crypto-ycash

          echo "YCash upstream sources found."

      - name: Cargo check
        run: cargo check --all-features

      - name: Run native tests
        run: cargo test --all-features
