name: Build Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # ========================================
      # CHECKOUT
      # ========================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ========================================
      # CHECK ZIP
      # ========================================

      - name: Check repository contents
        run: |
          set -e

          echo "========================================"
          echo "REPOSITORY CONTENTS"
          echo "========================================"

          ls -lah

          if [ -f "ycashwallet_fixed_agp8111.zip" ]; then
            echo "ZIP_FILE=ycashwallet_fixed_agp8111.zip" >> "$GITHUB_ENV"
            echo "SUCCESS: Fixed AGP 8.11.1 project ZIP found."

          elif [ -f "ycashwallet-fixed.zip" ]; then
            echo "ZIP_FILE=ycashwallet-fixed.zip" >> "$GITHUB_ENV"
            echo "SUCCESS: ycashwallet-fixed.zip found."

          elif [ -f "ycashwallet.zip" ]; then
            echo "ZIP_FILE=ycashwallet.zip" >> "$GITHUB_ENV"
            echo "SUCCESS: ycashwallet.zip found."

          else
            echo "ERROR: No wallet project ZIP was found."
            exit 1
          fi


      # ========================================
      # EXTRACT ZIP
      # ========================================

      - name: Extract project ZIP
        run: |
          set -e

          rm -rf extracted_project
          mkdir -p extracted_project

          echo "Extracting: $ZIP_FILE"

          unzip -q "$ZIP_FILE" -d extracted_project

          echo "Searching for Flutter projects..."

          find extracted_project \
            -maxdepth 10 \
            -type f \
            -name "pubspec.yaml" \
            -print


      # ========================================
      # LOCATE FLUTTER PROJECT
      # ========================================

      - name: Locate Flutter project
        run: |
          set -e

          SEARCH_ROOT="$GITHUB_WORKSPACE/extracted_project"
          PROJECT_DIR=""

          while IFS= read -r PUBSPEC; do

            DIR="$(dirname "$PUBSPEC")"

            echo "Checking: $DIR"

            if [ -d "$DIR/android" ]; then
              PROJECT_DIR="$DIR"
              break
            fi

          done < <(
            find "$SEARCH_ROOT" \
              -type f \
              -name "pubspec.yaml" \
              ! -path "*/.dart_tool/*" \
              ! -path "*/build/*"
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Could not locate Flutter project."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "SUCCESS: Flutter project found."
          echo "PROJECT_DIR=$PROJECT_DIR"


      # ========================================
      # JAVA
      # ========================================

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ========================================
      # FLUTTER
      # ========================================

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true


      # ========================================
      # ANDROID SDK
      # ========================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3


      - name: Install Android SDK components
        run: |
          set -e

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;29.0.14206865"


      # ========================================
      # ANDROID ENVIRONMENT
      # ========================================

      - name: Configure Android environment
        run: |
          set -e

          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"


      # ========================================
      # PROTOBUF / PROTOC
      # ========================================

      - name: Install Protobuf Compiler
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

          echo "Installed protoc:"
          protoc --version


      # ========================================
      # RUST
      # ========================================

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-linux-android
            armv7-linux-androideabi
            x86_64-linux-android


      - name: Install cargo-ndk
        run: |
          set -e

          cargo install cargo-ndk --locked


      # ========================================
      # VERIFY TOOLS
      # ========================================

      - name: Verify toolchains
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING TOOLCHAINS"
          echo "========================================"

          java -version
          flutter --version
          rustc --version
          cargo --version
          cargo ndk --version
          protoc --version

          echo ""
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865"

          test -f "$ANDROID_HOME/ndk/29.0.14206865/build/cmake/android.toolchain.cmake"


      # ========================================
      # CREATE GRADLE WRAPPER IF MISSING
      # ========================================

      - name: Create Gradle wrapper if missing
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          if [ -f "android/gradlew" ] && \
             [ -f "android/gradle/wrapper/gradle-wrapper.jar" ] && \
             [ -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then

            echo "SUCCESS: Gradle wrapper already exists."

            chmod +x android/gradlew
            exit 0
          fi

          echo "Gradle wrapper is missing. Creating it..."

          GRADLE_VERSION="8.14.3"

          TEMP_DIR="$(mktemp -d)"

          cd "$TEMP_DIR"

          printf 'rootProject.name = "wrapper-generator"\n' > settings.gradle
          printf '\n' > build.gradle

          curl \
            --fail \
            --location \
            --retry 3 \
            --output "gradle-${GRADLE_VERSION}-bin.zip" \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"

          unzip -q "gradle-${GRADLE_VERSION}-bin.zip"

          "./gradle-${GRADLE_VERSION}/bin/gradle" \
            wrapper \
            --gradle-version "${GRADLE_VERSION}" \
            --distribution-type bin \
            --no-daemon

          mkdir -p "${PROJECT_DIR}/android/gradle/wrapper"

          cp gradlew \
            "${PROJECT_DIR}/android/gradlew"

          cp gradlew.bat \
            "${PROJECT_DIR}/android/gradlew.bat"

          cp gradle/wrapper/gradle-wrapper.jar \
            "${PROJECT_DIR}/android/gradle/wrapper/gradle-wrapper.jar"

          cp gradle/wrapper/gradle-wrapper.properties \
            "${PROJECT_DIR}/android/gradle/wrapper/gradle-wrapper.properties"

          chmod +x "${PROJECT_DIR}/android/gradlew"

          echo "SUCCESS: Gradle wrapper created."


      # ========================================
      # SHOW ANDROID CONFIGURATION
      # ========================================

      - name: Show Android Gradle configuration
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "========================================"
          echo "ANDROID GRADLE CONFIGURATION"
          echo "========================================"

          grep -Rni \
            -E \
            'com\.android\.application|com\.android\.library|org\.jetbrains\.kotlin' \
            android \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            --include="*.toml" || true


      # ========================================
      # VERIFY GRADLE WRAPPER
      # ========================================

      - name: Verify Gradle
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          set -e

          if [ ! -f "./gradlew" ]; then
            echo "ERROR: gradlew is missing."
            exit 1
          fi

          chmod +x ./gradlew

          ./gradlew --version


      # ========================================
      # FLUTTER DEPENDENCIES
      # ========================================

      - name: Get Flutter dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          flutter clean

          rm -rf android/.gradle
          rm -rf .gradle

          flutter pub get


      # ========================================
      # BUILD APK
      # ========================================

      - name: Build Flutter APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          flutter build apk \
            --release \
            --verbose


      # ========================================
      # SHOW APK
      # ========================================

      - name: Show generated APK files
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          find build \
            -type f \
            -name "*.apk" \
            -print \
            -exec ls -lh {} \;


      # ========================================
      # UPLOAD APK
      # ========================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ycash-Wallet-Release-APK
          path: |
            ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/*.apk
            ${{ env.PROJECT_DIR }}/build/app/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
