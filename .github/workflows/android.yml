name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # IMPORTANT: The repository contains ycashwallet.zip at the repository root.
      # Do not use phase48 as the working directory before this extraction step.
      - name: Extract Ycash Wallet project
        shell: bash
        run: |
          set -euo pipefail
          echo "Repository root: $(pwd)"
          echo "Root files:"
          ls -la

          ZIP_FILE="ycashwallet.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "Expected $ZIP_FILE at repository root, but it was not found."
            echo "Available ZIP files:"
            find . -maxdepth 2 -type f -iname '*.zip' -print
            exit 1
          fi

          rm -rf phase48
          unzip -q "$ZIP_FILE"

          if [ ! -f phase48/pubspec.yaml ]; then
            echo "ERROR: phase48/pubspec.yaml was not found after extraction."
            echo "Archive contents:"
            unzip -l "$ZIP_FILE" | head -100
            exit 1
          fi

          echo "YCASH_PROJECT=$GITHUB_WORKSPACE/phase48" >> "$GITHUB_ENV"

      - name: Verify pinned Ycash cryptographic sources
        shell: bash
        run: |
          cd "$YCASH_PROJECT"
          python3 scripts/verify_ycash_lock.py

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show tool versions
        shell: bash
        run: |
          flutter --version
          java -version

      - name: Verify Flutter project
        shell: bash
        run: |
          cd "$YCASH_PROJECT"
          test -f pubspec.yaml
          test -d packages/ycash_core_ffi

      - name: Restore current Android host
        shell: bash
        run: |
          cd "$YCASH_PROJECT"
          rm -rf android
          flutter create --platforms=android --org com.ycashfoundation .

      - name: Upgrade Gradle wrapper
        shell: bash
        run: |
          cd "$YCASH_PROJECT/android"
          ./gradlew wrapper --gradle-version 8.14 --distribution-type all

      - name: Get dependencies
        shell: bash
        run: |
          cd "$YCASH_PROJECT"
          flutter pub get

      - name: Run Flutter tests
        shell: bash
        run: |
          cd "$YCASH_PROJECT"
          if [ -d test ] && find test -type f -name '*_test.dart' | grep -q .; then
            flutter test
          else
            echo "No Flutter tests found. Skipping tests."
          fi

      - name: Build debug APK
        shell: bash
        run: |
          cd "$YCASH_PROJECT"
          flutter build apk --debug

      - name: Build release APK
        shell: bash
        run: |
          cd "$YCASH_PROJECT"
          flutter build apk --release

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Ycash-Wallet-Debug-APK
          path: phase48/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Ycash-Wallet-Release-APK
          path: phase48/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - name: Show tool versions
        run: |
          flutter --version
          java -version

      - name: Verify Flutter project
        working-directory: phase48
        run: |
          test -f pubspec.yaml
          test -d packages/ycash_core_ffi

      - name: Restore current Android host
        working-directory: phase48
        run: |
          rm -rf android
          flutter create --platforms=android --org com.ycashfoundation .

      - name: Get dependencies
        working-directory: phase48
        run: flutter pub get

      - name: Run Flutter tests
        working-directory: phase48
        shell: bash
        run: |
          if [ -d test ] && find test -type f -name '*_test.dart' | grep -q .; then
            flutter test
          else
            echo "No Flutter tests found. Skipping tests."
          fi

      - name: Build debug APK
        working-directory: phase48
        run: flutter build apk --debug

      - name: Build release APK
        working-directory: phase48
        run: flutter build apk --release

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Ycash-Wallet-Debug-APK
          path: phase48/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Ycash-Wallet-Release-APK
          path: phase48/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
