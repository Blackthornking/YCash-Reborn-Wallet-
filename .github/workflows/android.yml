name: Build Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:

      # ========================================
      # CHECKOUT REPOSITORY
      # ========================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ========================================
      # SHOW REPOSITORY CONTENTS
      # ========================================

      - name: Show repository contents
        run: |
          echo "Repository files:"
          find . -maxdepth 3 -type f | sort


      # ========================================
      # FIND AND EXTRACT PROJECT ZIP
      # ========================================

      - name: Extract Flutter project
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          mkdir -p project

          unzip -q "$ZIP_FILE" -d project

          echo "Extracted files:"
          find project -maxdepth 3 -type f | sort | head -n 100


      # ========================================
      # FIND FLUTTER PROJECT DIRECTORY
      # ========================================

      - name: Find Flutter project
        id: project
        run: |
          set -e

          PROJECT_DIR=$(find project -name pubspec.yaml -type f -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: pubspec.yaml not found."
            exit 1
          fi

          echo "Flutter project found at:"
          echo "$PROJECT_DIR"

          echo "path=$PROJECT_DIR" >> "$GITHUB_OUTPUT"


      # ========================================
      # JAVA
      # ========================================

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle


      # ========================================
      # ANDROID SDK
      # ========================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
          sdkmanager "ndk;27.0.12077973"
          sdkmanager "cmake;3.22.1"

          yes | sdkmanager --licenses || true


      # ========================================
      # FLUTTER
      # ========================================

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true


      # ========================================
      # SYSTEM DEPENDENCIES
      # ========================================

      - name: Install native build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            protobuf-compiler \
            clang \
            pkg-config \
            libssl-dev


      # ========================================
      # RUST
      # ========================================

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-linux-android,
            armv7-linux-androideabi,
            x86_64-linux-android


      # ========================================
      # CARGO-NDK
      # ========================================

      - name: Install cargo-ndk
        run: |
          cargo install cargo-ndk --locked


      # ========================================
      # VERIFY TOOLCHAIN
      # ========================================

      - name: Verify toolchain
        run: |
          flutter --version
          java -version
          rustc --version
          cargo --version
          cargo ndk --version

          echo "ANDROID_HOME=$ANDROID_HOME"

          ls "$ANDROID_HOME/platforms/android-35"


      # ========================================
      # SHOW PROJECT STRUCTURE
      # ========================================

      - name: Show Flutter project structure
        working-directory: ${{ steps.project.outputs.path }}
        run: |
          pwd
          ls -la

          echo ""
          echo "Android directory:"
          ls -la android || true

          echo ""
          echo "Rust files:"
          find . -maxdepth 4 -name "Cargo.toml" -print


      # ========================================
      # FLUTTER DEPENDENCIES
      # ========================================

      - name: Get Flutter packages
        working-directory: ${{ steps.project.outputs.path }}
        run: |
          flutter clean
          flutter pub get


      # ========================================
      # ANALYZE
      # ========================================

      - name: Analyze Dart source
        working-directory: ${{ steps.project.outputs.path }}
        run: |
          flutter analyze


      # ========================================
      # BUILD RELEASE APK
      # ========================================

      - name: Build release APK
        working-directory: ${{ steps.project.outputs.path }}
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: |
          flutter build apk --release --verbose


      # ========================================
      # FIND APK
      # ========================================

      - name: Find generated APK
        run: |
          set -e

          echo "Searching for APK..."

          APK_FILE=$(find project -type f -name "app-release.apk" -print -quit)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: app-release.apk was not found."
            echo ""
            echo "All APK files:"
            find project -type f -name "*.apk" || true
            exit 1
          fi

          echo "APK found:"
          echo "$APK_FILE"

          mkdir -p release

          cp "$APK_FILE" release/Ycash-Reborn.apk

          ls -lh release/


      # ========================================
      # UPLOAD APK
      # ========================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ycash-Reborn-release-apk
          path: release/Ycash-Reborn.apk
          if-no-files-found: error
          retention-days: 14
