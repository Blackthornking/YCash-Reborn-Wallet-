name: Build Ycash Wallet APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository files
        run: |
          echo "Repository contents:"
          ls -la

      - name: Extract Ycash Wallet source
        run: |
          unzip -q ycashwallet.zip
          echo "Extracted contents:"
          ls -la
          ls -la phase48

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Flutter project
        working-directory: phase48
        run: |
          pwd
          ls -la
          test -f pubspec.yaml
          test -d android

      - name: Get dependencies
        working-directory: phase48
        run: flutter pub get

      - name: Analyze project
        working-directory: phase48
        run: flutter analyze

      - name: Run Flutter tests
        working-directory: phase48
        run: |
          if [ -d test ] && find test -type f -name '*_test.dart' | grep -q .; then
            flutter test
          else
            echo "No Flutter tests found. Skipping tests."
          fi

      - name: Build debug APK
        working-directory: phase48
        run: flutter build apk --debug

      - name: Build release APK
        working-directory: phase48
        run: flutter build apk --release

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Ycash-Wallet-Debug-APK
          path: phase48/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Ycash-Wallet-Release-APK
          path: phase48/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error


  rust-check:
    name: Check Rust Core
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Ycash Wallet source
        run: unzip -q ycashwallet.zip

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Check Rust core
        working-directory: phase48/packages/ycash_core_ffi/rust
        run: cargo check

      - name: Test Rust core
        working-directory: phase48/packages/ycash_core_ffi/rust
        run: cargo test
      - name: Check for Flutter tests
        shell: bash
        run: |
          if [ -d "test" ] && find test -type f -name "*_test.dart" | grep -q .; then
            flutter test
          else
            echo "No Flutter tests found. Skipping tests."
          fi

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Ycash-Debug-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Ycash-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
