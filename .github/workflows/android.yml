name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Ycash Wallet project
        run: |
          unzip -q ycashwallet.zip
          test -f phase48/pubspec.yaml

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          java -version

      - name: Verify Flutter project
        working-directory: phase48
        run: |
          test -f pubspec.yaml
          test -d packages/ycash_core_ffi

      - name: Restore current Android host
        working-directory: phase48
        run: |
          rm -rf android
          flutter create --platforms=android --org com.ycashfoundation .

      - name: Get dependencies
        working-directory: phase48
        run: flutter pub get

      - name: Run Flutter tests
        working-directory: phase48
        shell: bash
        run: |
          if [ -d test ] && find test -type f -name '*_test.dart' | grep -q .; then
            flutter test
          else
            echo "No Flutter tests found. Skipping tests."
          fi

      - name: Build debug APK
        working-directory: phase48
        run: flutter build apk --debug

      - name: Build release APK
        working-directory: phase48
        run: flutter build apk --release

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Ycash-Wallet-Debug-APK
          path: phase48/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Ycash-Wallet-Release-APK
          path: phase48/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
