name: Build Android APK

"on":
  workflow_dispatch: {}

  push:
    branches:
      - main

  pull_request: {}

permissions:
 contents: read

jobs:
build:
name: Build Flutter APK
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Show repository contents
    shell: bash
    run: |
      echo "Repository files:"
      find "$GITHUB_WORKSPACE" -maxdepth 3 -type f | sort

  - name: Find project ZIP
    id: zip
    shell: bash
    run: |
      set -euo pipefail

      ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
        -maxdepth 1 \
        -type f \
        -name "*.zip" \
        -print \
        | head -n 1)

      if [ -z "$ZIP_FILE" ]; then
        echo "ERROR: No ZIP file found in repository root."
        exit 1
      fi

      echo "Found project ZIP: $ZIP_FILE"
      echo "path=$ZIP_FILE" >> "$GITHUB_OUTPUT"

  - name: Extract Flutter project
    shell: bash
    run: |
      set -euo pipefail

      PROJECT_DIR="$GITHUB_WORKSPACE/project"

      rm -rf "$PROJECT_DIR"
      mkdir -p "$PROJECT_DIR"

      unzip -q "${{ steps.zip.outputs.path }}" -d "$PROJECT_DIR"

      echo "Extracted project:"
      ls -la "$PROJECT_DIR"

  - name: Verify Flutter project
    id: project
    shell: bash
    run: |
      set -euo pipefail

      PROJECT_DIR="$GITHUB_WORKSPACE/project"

      if [ ! -f "$PROJECT_DIR/pubspec.yaml" ]; then
        echo "ERROR: pubspec.yaml not found."
        echo "Project contents:"
        find "$PROJECT_DIR" -maxdepth 3 -type f | sort | head -n 300
        exit 1
      fi

      echo "Flutter project verified."
      echo "path=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

  - name: Set up Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"
      cache: gradle

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Install Android SDK and NDK
    shell: bash
    run: |
      yes | sdkmanager --licenses || true

      sdkmanager \
        "platform-tools" \
        "platforms;android-36" \
        "build-tools;36.0.0" \
        "ndk;27.0.12077973" \
        "cmake;3.22.1"

  - name: Configure Android NDK
    shell: bash
    run: |
      echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
      echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

  - name: Set up Flutter
    uses: subosito/flutter-action@v2
    with:
      flutter-version: "3.47.2"
      channel: stable
      cache: true

  - name: Install system dependencies
    shell: bash
    run: |
      sudo apt-get update
      sudo apt-get install -y \
        unzip \
        protobuf-compiler \
        clang \
        pkg-config \
        libssl-dev

  - name: Set up Rust
    uses: dtolnay/rust-toolchain@stable
    with:
      targets: |
        aarch64-linux-android
        armv7-linux-androideabi
        x86_64-linux-android

  - name: Install cargo-ndk
    shell: bash
    run: |
      cargo install cargo-ndk --locked

  - name: Verify toolchain
    shell: bash
    run: |
      flutter --version
      java -version
      rustc --version
      cargo --version
      cargo ndk --version

      echo "ANDROID_HOME=$ANDROID_HOME"
      echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"

      echo "Android SDK:"
      ls "$ANDROID_HOME/platforms/android-36"

      echo "Android NDK:"
      ls "$ANDROID_NDK_HOME"

  - name: Show project structure
    working-directory: ${{ steps.project.outputs.path }}
    shell: bash
    run: |
      pwd

      echo "Top-level files:"
      ls -la

      echo "Android directory:"
      ls -la android || true

      echo "Rust Cargo.toml files:"
      find . -type f -name "Cargo.toml" -print

  - name: Get Flutter packages
    working-directory: ${{ steps.project.outputs.path }}
    shell: bash
    run: |
      flutter clean
      flutter pub get

  - name: Create temporary test signing key
    working-directory: ${{ steps.project.outputs.path }}
    shell: bash
    run: |
      set -euo pipefail

      KEYSTORE="android/app/temp-release-key.jks"

      rm -f "$KEYSTORE"

      keytool -genkeypair \
        -v \
        -keystore "$KEYSTORE" \
        -alias temp-release \
        -keyalg RSA \
        -keysize 4096 \
        -validity 10000 \
        -storepass temporarypassword123 \
        -keypass temporarypassword123 \
        -dname "CN=Ycash Reborn, OU=Development, O=Ycash, L=Glasgow, ST=Scotland, C=GB"

      echo "Temporary test keystore created."

  - name: Create signing properties
    working-directory: ${{ steps.project.outputs.path }}
    shell: bash
    run: |
      set -euo pipefail

      cat > android/key.properties <<'EOF'
      storePassword=temporarypassword123
      keyPassword=temporarypassword123
      keyAlias=temp-release
      storeFile=temp-release-key.jks
      EOF

      echo "Signing properties created."

  - name: Verify signing files
    working-directory: ${{ steps.project.outputs.path }}
    shell: bash
    run: |
      ls -lh android/app/temp-release-key.jks
      cat android/key.properties

  - name: Analyze Dart source
    working-directory: ${{ steps.project.outputs.path }}
    shell: bash
    run: |
      flutter analyze || true

  - name: Build release APK
    working-directory: ${{ steps.project.outputs.path }}
    shell: bash
    run: |
      flutter build apk --release --verbose

  - name: Find generated APK
    id: apk
    shell: bash
    run: |
      set -euo pipefail

      APK_FILE=$(find "$GITHUB_WORKSPACE/project" \
        -type f \
        -name "app-release.apk" \
        -print \
        | head -n 1)

      if [ -z "$APK_FILE" ]; then
        echo "ERROR: app-release.apk was not found."

        echo "Available APK files:"
        find "$GITHUB_WORKSPACE/project" \
          -type f \
          -name "*.apk" \
          -print || true

        exit 1
      fi

      echo "APK found: $APK_FILE"
      echo "path=$APK_FILE" >> "$GITHUB_OUTPUT"

  - name: Prepare final APK
    shell: bash
    run: |
      set -euo pipefail

      mkdir -p "$GITHUB_WORKSPACE/release"

      cp "${{ steps.apk.outputs.path }}" \
        "$GITHUB_WORKSPACE/release/Ycash-Reborn.apk"

      echo "Final APK:"
      ls -lh "$GITHUB_WORKSPACE/release/Ycash-Reborn.apk"

  - name: Verify APK signature
    shell: bash
    run: |
      set -euo pipefail

      APK="$GITHUB_WORKSPACE/release/Ycash-Reborn.apk"

      APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"

      if [ ! -x "$APKSIGNER" ]; then
        echo "ERROR: apksigner not found at:"
        echo "$APKSIGNER"

        find "$ANDROID_HOME/build-tools" -name apksigner -type f -print
        exit 1
      fi

      echo "Verifying APK signature..."

      "$APKSIGNER" verify \
        --verbose \
        --print-certs \
        "$APK"

      echo "APK signature verification PASSED."

  - name: Generate APK integrity checksums
    shell: bash
    run: |
      set -euo pipefail

      cd "$GITHUB_WORKSPACE/release"

      sha256sum Ycash-Reborn.apk > Ycash-Reborn.apk.sha256
      sha512sum Ycash-Reborn.apk > Ycash-Reborn.apk.sha512

      echo "SHA-256:"
      cat Ycash-Reborn.apk.sha256

      echo "SHA-512:"
      cat Ycash-Reborn.apk.sha512

  - name: Final APK integrity test
    shell: bash
    run: |
      set -euo pipefail

      cd "$GITHUB_WORKSPACE/release"

      sha256sum --check Ycash-Reborn.apk.sha256
      sha512sum --check Ycash-Reborn.apk.sha512

      echo "APK integrity verification PASSED."

  - name: Show release files
    shell: bash
    run: |
      echo "Release files:"
      ls -lh "$GITHUB_WORKSPACE/release"

  - name: Upload APK and integrity files
    uses: actions/upload-artifact@v4
    with:
      name: Ycash-Reborn-release-apk
      path: |
        release/Ycash-Reborn.apk
        release/Ycash-Reborn.apk.sha256
        release/Ycash-Reborn.apk.sha512
      if-no-files-found: error
      retention-days: 14
