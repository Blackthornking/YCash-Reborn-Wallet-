      # ========================================
      # BUILD APK
      # ========================================

      - name: Build Flutter APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          flutter build apk \
            --release \
            --verbose


      # ========================================
      # LOCATE GENERATED APK
      # ========================================

      - name: Locate release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "========================================"
          echo "LOCATING APK"
          echo "========================================"

          APK=""

          if [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            APK="build/app/outputs/flutter-apk/app-release.apk"

          elif [ -f "build/app/outputs/apk/release/app-release-unsigned.apk" ]; then
            APK="build/app/outputs/apk/release/app-release-unsigned.apk"

          elif [ -f "build/app/outputs/apk/release/app-release.apk" ]; then
            APK="build/app/outputs/apk/release/app-release.apk"

          else
            echo "ERROR: Could not find release APK."
            find build -type f -name "*.apk" -print
            exit 1
          fi

          echo "APK_PATH=$PROJECT_DIR/$APK" >> "$GITHUB_ENV"

          echo "SUCCESS: Found APK:"
          echo "$PROJECT_DIR/$APK"

          ls -lh "$APK"


      # ========================================
      # GENERATE TEST SIGNING KEY
      # ========================================

      - name: Generate temporary signing key
        run: |
          set -e

          KEYSTORE="$RUNNER_TEMP/ycash-test.jks"

          keytool -genkeypair \
            -v \
            -keystore "$KEYSTORE" \
            -storepass "ycash-test-password" \
            -keypass "ycash-test-password" \
            -alias "ycash" \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -dname "CN=Ycash Test,O=Ycash,C=GB"

          echo "KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"

          echo "SUCCESS: Temporary signing key created."


      # ========================================
      # FIND ANDROID SIGNING TOOLS
      # ========================================

      - name: Configure APK signing tools
        run: |
          set -e

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          if [ ! -x "$BUILD_TOOLS/apksigner" ]; then
            echo "ERROR: apksigner not found."
            find "$ANDROID_HOME/build-tools" -name apksigner -print
            exit 1
          fi

          if [ ! -x "$BUILD_TOOLS/zipalign" ]; then
            echo "ERROR: zipalign not found."
            find "$ANDROID_HOME/build-tools" -name zipalign -print
            exit 1
          fi

          echo "APKSIGNER=$BUILD_TOOLS/apksigner" >> "$GITHUB_ENV"
          echo "ZIPALIGN=$BUILD_TOOLS/zipalign" >> "$GITHUB_ENV"

          "$BUILD_TOOLS/apksigner" --version


      # ========================================
      # ZIPALIGN APK
      # ========================================

      - name: Align APK
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/signed-output"

          "$ZIPALIGN" \
            -f \
            -p \
            4 \
            "$APK_PATH" \
            "$GITHUB_WORKSPACE/signed-output/Ycash-aligned.apk"

          echo "SUCCESS: APK aligned."


      # ========================================
      # SIGN APK
      # ========================================

      - name: Sign APK with v1 v2 v3 signatures
        run: |
          set -e

          "$APKSIGNER" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-key-alias "ycash" \
            --ks-pass pass:ycash-test-password \
            --key-pass pass:ycash-test-password \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$GITHUB_WORKSPACE/signed-output/Ycash.apk" \
            "$GITHUB_WORKSPACE/signed-output/Ycash-aligned.apk"

          echo "SUCCESS: APK signed."


      # ========================================
      # VERIFY SIGNATURE
      # ========================================

      - name: Verify signed APK
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING APK SIGNATURE"
          echo "========================================"

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$GITHUB_WORKSPACE/signed-output/Ycash.apk"

          echo ""
          echo "========================================"
          echo "VERIFYING ZIP ALIGNMENT"
          echo "========================================"

          "$ZIPALIGN" \
            -c \
            -v \
            4 \
            "$GITHUB_WORKSPACE/signed-output/Ycash.apk"

          echo ""
          echo "SUCCESS: APK PASSED SIGNATURE VERIFICATION"

          ls -lh "$GITHUB_WORKSPACE/signed-output/Ycash.apk"


      # ========================================
      # UPLOAD VERIFIED APK
      # ========================================

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: Ycash-Wallet-Verified-APK
          path: |
            signed-output/Ycash.apk
          if-no-files-found: error
          retention-days: 30
