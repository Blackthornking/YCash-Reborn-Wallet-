name: Build Ycash Wallet from ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Extract and Build Ycash Wallet
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository files
        shell: bash
        run: |
          echo "Repository contents:"
          find . -maxdepth 3 -type f | sort | head -n 200

      - name: Install system dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            unzip \
            zip \
            curl \
            wget \
            build-essential \
            pkg-config \
            libssl-dev \
            clang \
            cmake \
            git \
            jq \
            python3

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Verify Rust installation
        shell: bash
        run: |
          rustc --version
          cargo --version

      - name: Find ycashwallet.zip
        id: find_zip
        shell: bash
        run: |
          ZIP_FILE=$(find . -type f -iname "ycashwallet.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ycashwallet.zip was not found."
            echo "Files available:"
            find . -maxdepth 4 -type f | sort | head -n 200
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract ycashwallet.zip
        shell: bash
        run: |
          rm -rf extracted_project
          mkdir -p extracted_project
          unzip -q "${{ steps.find_zip.outputs.zip_file }}" -d extracted_project

          echo "ZIP extracted successfully."
          echo "Extracted files:"
          find extracted_project -maxdepth 4 -type f | sort | head -n 300

      - name: Find Flutter project root
        id: flutter
        shell: bash
        run: |
          PUBSPEC=$(find extracted_project -type f -name pubspec.yaml | head -n 1)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: Could not find pubspec.yaml inside ycashwallet.zip."
            echo "Extracted contents:"
            find extracted_project -maxdepth 5 -type f | sort | head -n 300
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$PUBSPEC")

          echo "Flutter project root: $PROJECT_ROOT"
          echo "root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"

      - name: Find Rust projects
        shell: bash
        run: |
          echo "Searching for Cargo.toml files..."
          find extracted_project -type f -name Cargo.toml | sort || true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Flutter installation
        shell: bash
        run: |
          flutter --version
          dart --version

      - name: Get Flutter dependencies
        working-directory: ${{ steps.flutter.outputs.root }}
        run: flutter pub get

      - name: Analyze Flutter project
        working-directory: ${{ steps.flutter.outputs.root }}
        run: flutter analyze

      - name: Run Flutter tests
        working-directory: ${{ steps.flutter.outputs.root }}
        run: flutter test
        continue-on-error: true

      - name: Check Rust projects
        shell: bash
        run: |
          set -e

          mapfile -t CARGO_FILES < <(find extracted_project -type f -name Cargo.toml)

          if [ "${#CARGO_FILES[@]}" -eq 0 ]; then
            echo "No Rust Cargo.toml files found."
            exit 0
          fi

          for CARGO_FILE in "${CARGO_FILES[@]}"; do
            RUST_DIR=$(dirname "$CARGO_FILE")

            echo "Checking Rust project: $RUST_DIR"

            (
              cd "$RUST_DIR"
              cargo check
            )
          done

      - name: Check Ycash transaction feature
        shell: bash
        run: |
          set -e

          mapfile -t CARGO_FILES < <(find extracted_project -type f -name Cargo.toml)

          for CARGO_FILE in "${CARGO_FILES[@]}"; do
            RUST_DIR=$(dirname "$CARGO_FILE")

            if grep -q "ycash-transaction" "$CARGO_FILE"; then
              echo "Checking ycash-transaction feature in $RUST_DIR"

              (
                cd "$RUST_DIR"
                cargo check --features ycash-transaction
              )
            fi
          done

      - name: Check Ycash scanner feature
        shell: bash
        run: |
          set -e

          mapfile -t CARGO_FILES < <(find extracted_project -type f -name Cargo.toml)

          for CARGO_FILE in "${CARGO_FILES[@]}"; do
            RUST_DIR=$(dirname "$CARGO_FILE")

            if grep -q "ycash-scanner" "$CARGO_FILE"; then
              echo "Checking ycash-scanner feature in $RUST_DIR"

              (
                cd "$RUST_DIR"
                cargo check --features ycash-scanner
              )
            fi
          done

      - name: Build Android debug APK
        working-directory: ${{ steps.flutter.outputs.root }}
        run: flutter build apk --debug

      - name: Build Android release APK
        working-directory: ${{ steps.flutter.outputs.root }}
        run: flutter build apk --release

      - name: Find Phase 48 harness
        id: harness
        shell: bash
        run: |
          HARNESS=$(find extracted_project -type f -name "*.sh" | grep -Ei "phase48|regtest|e2e" | head -n 1 || true)

          if [ -n "$HARNESS" ]; then
            chmod +x "$HARNESS"
            echo "Found harness: $HARNESS"
            echo "path=$HARNESS" >> "$GITHUB_OUTPUT"
          else
            echo "No Phase 48 harness found."
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Phase 48 harness
        if: steps.harness.outputs.path != ''
        shell: bash
        run: |
          echo "Running Phase 48 harness..."
          bash "${{ steps.harness.outputs.path }}"
        continue-on-error: true

      - name: Prepare build artifacts
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts

          echo "Copying APK files..."

          find extracted_project -type f -name "*.apk" \
            -exec cp {} artifacts/ \; \
            2>/dev/null || true

          echo "Copying logs and test evidence..."

          find extracted_project -type f \( \
            -name "*.log" -o \
            -name "*.json" -o \
            -name "*.bin" \
          \) \
            -exec cp --parents {} artifacts/ \; \
            2>/dev/null || true

          echo "Artifact contents:"
          find artifacts -type f | sort || true

      - name: Upload APK and test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ycashwallet-build
          path: artifacts
          if-no-files-found: warn
          retention-days: 14

      - name: Workflow summary
        if: always()
        shell: bash
        run: |
          echo "# Ycash Wallet Build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- ZIP file: ycashwallet.zip" >> "$GITHUB_STEP_SUMMARY"
          echo "- ZIP extraction: completed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Rust checks: attempted" >> "$GITHUB_STEP_SUMMARY"
          echo "- Flutter analysis: attempted" >> "$GITHUB_STEP_SUMMARY"
          echo "- Debug APK: attempted" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release APK: attempted" >> "$GITHUB_STEP_SUMMARY"
          echo "- Phase 48 harness: attempted if found" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build artifacts: uploaded" >> "$GITHUB_STEP_SUMMARY"
