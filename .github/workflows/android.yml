name: Build YRed Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build YRed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Show project files
        run: |
          pwd
          ls -la
          find . -maxdepth 3 -type f -name "pubspec.yaml"

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Ensure Android SDK licenses accepted
        run: |
          # Accept Android licenses (may fail if Android SDK isn't installed on runner)
          yes | flutter doctor --android-licenses || true
          flutter doctor -v

      - name: Build APK (change --release to --debug if you prefer)
        run: flutter build apk --release --no-shrink

      - name: Upload APK artifact(s)
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
