name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract wallet project
        run: |
          echo "Repository contents:"
          ls -la

          if [ ! -f "ycashwallet.zip" ]; then
            echo "ERROR: ycashwallet.zip was not found in the repository root."
            exit 1
          fi

          rm -rf extracted_wallet
          mkdir extracted_wallet

          unzip -q ycashwallet.zip -d extracted_wallet

          echo "Extracted contents:"
          find extracted_wallet -maxdepth 4 -type f -name pubspec.yaml -print

      - name: Find Flutter project
        id: project
        run: |
          PROJECT_DIR=$(dirname "$(find extracted_wallet -type f -name pubspec.yaml | head -n 1)")

          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            echo "ERROR: Could not find pubspec.yaml inside ycashwallet.zip"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Flutter project found at:"
          echo "$PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          dart --version
          java -version

      - name: Get Flutter dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Restore Android host if needed
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "Android Gradle wrapper missing. Regenerating Android host..."
            rm -rf android
            flutter create --platforms=android .
          fi

          test -f android/gradle/wrapper/gradle-wrapper.properties

      - name: Upgrade Gradle wrapper to 8.14
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/gradle/wrapper/gradle-wrapper.properties")

          text = p.read_text()

          text = re.sub(
              r"^distributionUrl=.*$",
              r"distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14-bin.zip",
              text,
              flags=re.MULTILINE
          )

          p.write_text(text)

          print(p.read_text())

          if "gradle-8.14-bin.zip" not in p.read_text():
              raise SystemExit("ERROR: Failed to set Gradle 8.14")
          PY

          chmod +x android/gradlew

      - name: Verify Gradle version
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          grep "gradle-8.14-bin.zip" gradle/wrapper/gradle-wrapper.properties
          ./gradlew --version

      - name: Analyze Flutter project
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter analyze

      - name: Run Flutter tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter test

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --debug

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: YCash-Wallet-Debug-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: YCash-Wallet-Release-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
