name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract wallet project
        run: |
          echo "Repository contents:"
          ls -la

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          mkdir -p wallet_project
          unzip -q "$ZIP_FILE" -d wallet_project

          echo "Searching for Flutter project..."
          find wallet_project -type f -name "pubspec.yaml"

      - name: Find Flutter project
        id: flutter_project
        run: |
          PROJECT_FILE=$(find wallet_project -type f -name "pubspec.yaml" -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: Could not find pubspec.yaml"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "Flutter project found at: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          dart --version
          java -version
          javac -version

      - name: Restore Android host if needed
        working-directory: ${{ steps.flutter_project.outputs.dir }}
        run: |
          if [ ! -d "android" ]; then
            echo "Android directory is missing. Creating Android host..."
            flutter create --platforms=android .
          else
            echo "Android directory already exists."
          fi

      - name: Ensure Gradle wrapper exists
        working-directory: ${{ steps.flutter_project.outputs.dir }}
        run: |
          if [ ! -f "android/gradlew" ]; then
            echo "Generating missing Android Gradle wrapper..."

            cp android/settings.gradle.kts /tmp/settings.gradle.kts 2>/dev/null || true
            cp android/build.gradle.kts /tmp/build.gradle.kts 2>/dev/null || true
            cp android/app/build.gradle.kts /tmp/app-build.gradle.kts 2>/dev/null || true
            cp android/gradle.properties /tmp/gradle.properties 2>/dev/null || true

            flutter create --platforms=android .

            [ -f /tmp/settings.gradle.kts ] && cp /tmp/settings.gradle.kts android/settings.gradle.kts
            [ -f /tmp/build.gradle.kts ] && cp /tmp/build.gradle.kts android/build.gradle.kts
            [ -f /tmp/app-build.gradle.kts ] && cp /tmp/app-build.gradle.kts android/app/build.gradle.kts
            [ -f /tmp/gradle.properties ] && cp /tmp/gradle.properties android/gradle.properties
          fi

          chmod +x android/gradlew

      - name: Pin Android Gradle configuration
        working-directory: ${{ steps.flutter_project.outputs.dir }}
        run: |
          echo "Checking Android Gradle configuration..."

          python3 <<'PY'
          from pathlib import Path
          import re

          settings = Path("android/settings.gradle.kts")

          if not settings.exists():
              raise SystemExit("ERROR: android/settings.gradle.kts not found")

          text = settings.read_text()

          text = re.sub(
              r'id\("com\.android\.application"\)\s+version\s+"[^"]+"\s+apply\s+false',
              'id("com.android.application") version "8.7.3" apply false',
              text
          )

          text = re.sub(
              r'id\("org\.jetbrains\.kotlin\.android"\)\s+version\s+"[^"]+"\s+apply\s+false',
              'id("org.jetbrains.kotlin.android") version "2.1.0" apply false',
              text
          )

          settings.write_text(text)

          wrapper = Path(
              "android/gradle/wrapper/gradle-wrapper.properties"
          )

          if not wrapper.exists():
              raise SystemExit(
                  "ERROR: Gradle wrapper properties not found"
              )

          wrapper_text = wrapper.read_text()

          wrapper_text = re.sub(
              r'gradle-[0-9.]+-(?:bin|all)\.zip',
              'gradle-8.14-bin.zip',
              wrapper_text
          )

          wrapper.write_text(wrapper_text)

          print("Android Gradle Plugin: 8.7.3")
          print("Kotlin: 2.1.0")
          print("Gradle: 8.14")
          PY

      - name: Verify Gradle version
        working-directory: ${{ steps.flutter_project.outputs.dir }}/android
        run: |
          ./gradlew --version

      - name: Get Flutter dependencies
        working-directory: ${{ steps.flutter_project.outputs.dir }}
        run: |
          flutter pub get

      - name: Verify Ycash cryptographic sources
        working-directory: ${{ steps.flutter_project.outputs.dir }}
        run: |
          if [ -f "scripts/verify_ycash_lock.py" ]; then
            python3 scripts/verify_ycash_lock.py
          else
            echo "Verification script not present — skipping."
          fi

      - name: Analyze Flutter project
        working-directory: ${{ steps.flutter_project.outputs.dir }}
        run: |
          flutter analyze

      - name: Run Flutter tests
        working-directory: ${{ steps.flutter_project.outputs.dir }}
        run: |
          flutter test

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Android Rust build tools
        run: |
          cargo install cargo-ndk

      - name: Build debug APK
        working-directory: ${{ steps.flutter_project.outputs.dir }}
        run: |
          flutter build apk --debug

      - name: Build release APK
        working-directory: ${{ steps.flutter_project.outputs.dir }}
        run: |
          flutter build apk --release

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Ycash-Wallet-Debug-APK
          path: ${{ steps.flutter_project.outputs.dir }}/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Ycash-Wallet-Release-APK
          path: ${{ steps.flutter_project.outputs.dir }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
