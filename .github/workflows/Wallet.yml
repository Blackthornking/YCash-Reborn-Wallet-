name: Build Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository contents
        run: |
          echo "Repository contents:"
          ls -lah

          echo ""
          echo "ZIP files:"
          find . -maxdepth 2 -type f -iname "*.zip" -print

      - name: Extract project ZIP
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "Using ZIP file: $ZIP_FILE"

          rm -rf extracted_project
          mkdir -p extracted_project

          unzip -q "$ZIP_FILE" -d extracted_project

          echo "Extracted project files:"
          find extracted_project -maxdepth 6 \
            -type f \
            \( -name "pubspec.yaml" -o -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print

      - name: Locate Flutter project
        run: |
          set -e

          PROJECT_DIR=$(find "$GITHUB_WORKSPACE/extracted_project" \
            -name pubspec.yaml \
            -type f \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Could not find pubspec.yaml."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Flutter project found at:"
          echo "$PROJECT_DIR"

          ls -lah "$PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-linux-android
            armv7-linux-androideabi
            x86_64-linux-android

      - name: Install cargo-ndk
        run: |
          cargo install cargo-ndk --locked

      - name: Configure Android NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

          if [ ! -d "$ANDROID_NDK_LATEST_HOME" ]; then
            echo "ERROR: Android NDK not found."
            exit 1
          fi

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_LATEST_HOME=$ANDROID_NDK_LATEST_HOME"

      - name: Verify build tools
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"

          java -version
          flutter --version
          rustc --version
          cargo --version
          cargo ndk --version

          echo ""
          echo "Installed Rust targets:"
          rustup target list --installed

      - name: Configure Flutter and Kotlin compatibility
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "Configuring Android compatibility"
          echo "=========================================="

          mkdir -p android

          GRADLE_PROPERTIES="android/gradle.properties"

          touch "$GRADLE_PROPERTIES"

          # Remove existing newDsl settings
          sed -i '/^android\.newDsl=/d' "$GRADLE_PROPERTIES"

          echo "" >> "$GRADLE_PROPERTIES"
          echo "# GitHub Actions Flutter compatibility" >> "$GRADLE_PROPERTIES"
          echo "android.newDsl=false" >> "$GRADLE_PROPERTIES"

          echo ""
          echo "Updating Kotlin versions to 2.2.20..."

          # Update Kotlin plugin versions in Gradle files
          find android \
            -type f \
            \( -name "*.gradle" -o -name "*.gradle.kts" -o -name "gradle.properties" \) \
            -print0 | while IFS= read -r -d '' file; do

              echo "Checking: $file"

              # Common Kotlin versions used by older Flutter projects
              sed -i \
                -e 's/2\.1\.0/2.2.20/g' \
                -e 's/2\.1\.10/2.2.20/g' \
                -e 's/2\.1\.20/2.2.20/g' \
                -e 's/2\.0\.21/2.2.20/g' \
                -e 's/1\.9\.25/2.2.20/g' \
                -e 's/1\.9\.24/2.2.20/g' \
                "$file"

            done

          echo ""
          echo "Android Gradle files after compatibility update:"

          find android \
            -maxdepth 2 \
            -type f \
            \( -name "*.gradle" -o -name "*.gradle.kts" -o -name "gradle.properties" \) \
            -print

          echo ""
          echo "gradle.properties:"
          cat "$GRADLE_PROPERTIES"

          echo ""
          echo "Kotlin references:"
          grep -Rni \
            -E "kotlin|org.jetbrains.kotlin" \
            android \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            --include="gradle.properties" || true

      - name: Get Flutter dependencies
        run: |
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Verify Ycash cryptographic sources
        run: |
          cd "$PROJECT_DIR"

          if [ -f scripts/verify_ycash_lock.py ]; then
            python3 scripts/verify_ycash_lock.py
          else
            echo "Ycash verification script not found — skipping."
          fi

      - name: Analyze Flutter project
        run: |
          cd "$PROJECT_DIR"
          flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        run: |
          cd "$PROJECT_DIR"
          flutter test

      - name: Show Android configuration
        run: |
          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "Android files"
          echo "=========================================="

          find android -maxdepth 3 -type f -print | sort

          echo ""
          echo "=========================================="
          echo "Gradle properties"
          echo "=========================================="

          cat android/gradle.properties || true

          echo ""
          echo "=========================================="
          echo "Flutter doctor"
          echo "=========================================="

          flutter doctor -v

      - name: Build debug APK
        run: |
          set -e

          cd "$PROJECT_DIR"

          export PATH="$HOME/.cargo/bin:$PATH"

          flutter clean
          flutter pub get

          flutter build apk --debug --verbose

      - name: Build release APK
        run: |
          set -e

          cd "$PROJECT_DIR"

          export PATH="$HOME/.cargo/bin:$PATH"

          flutter build apk --release --verbose

      - name: Show generated APKs
        if: always()
        run: |
          cd "$PROJECT_DIR"

          echo "Generated APK files:"

          find build \
            -type f \
            -name "*.apk" \
            -print || true

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ycash-Wallet-Debug-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: warn

      - name: Upload release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ycash-Wallet-Release-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn
