name: Build Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository contents
        run: |
          echo "Repository contents:"
          ls -lah

          echo ""
          echo "ZIP files:"
          find . -maxdepth 2 -type f -iname "*.zip" -print

      - name: Extract project ZIP
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "Using ZIP file: $ZIP_FILE"

          rm -rf extracted_project
          mkdir -p extracted_project

          unzip -q "$ZIP_FILE" -d extracted_project

          echo "Extracted project files:"
          find extracted_project -maxdepth 6 \
            -type f \
            -name "pubspec.yaml" \
            -o -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -print

      - name: Locate Flutter project
        run: |
          set -e

          PROJECT_DIR=$(find "$GITHUB_WORKSPACE/extracted_project" \
            -name pubspec.yaml \
            -type f \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Could not find pubspec.yaml."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Flutter project found at:"
          echo "$PROJECT_DIR"

          ls -lah "$PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-linux-android
            armv7-linux-androideabi
            x86_64-linux-android

      - name: Install cargo-ndk
        run: |
          cargo install cargo-ndk --locked

      - name: Configure Android NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_LATEST_HOME=$ANDROID_NDK_LATEST_HOME"

          if [ ! -d "$ANDROID_NDK_LATEST_HOME" ]; then
            echo "ERROR: Android NDK not found."
            exit 1
          fi

      - name: Verify build tools
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"

          java -version
          flutter --version
          rustc --version
          cargo --version
          cargo ndk --version

          echo ""
          echo "Installed Rust targets:"
          rustup target list --installed

