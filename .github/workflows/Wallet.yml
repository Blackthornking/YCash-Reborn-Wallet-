name: Build Flutter Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository contents
        run: |
          echo "Repository contents:"
          ls -lah

      - name: Find and extract wallet ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found"
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          mkdir -p extracted_project
          unzip -q "$ZIP_FILE" -d extracted_project

          echo "Extracted files:"
          find extracted_project -maxdepth 3 -type f | head -100

      - name: Find Flutter project
        run: |
          PUBSPEC=$(find extracted_project -name pubspec.yaml -type f | head -n 1)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Flutter project:"
          echo "$PROJECT_DIR"

          ls -lah "$PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          dart --version
          java -version

      - name: Get Flutter dependencies
        run: |
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Verify project layout
        run: |
          cd "$PROJECT_DIR"

          test -f pubspec.yaml

          echo "Project structure:"
          find . -maxdepth 2 -type f | sort

      - name: Generate Android Gradle wrapper if missing
        run: |
          cd "$PROJECT_DIR"

          if [ ! -d android ]; then
            echo "Android folder missing. Creating Android platform..."
            flutter create --platforms=android .
          fi

          if [ ! -f android/gradlew ]; then
            echo "Gradle wrapper missing. Regenerating Android platform..."

            flutter create --platforms=android .

            echo "Android platform generated."
          fi

          chmod +x android/gradlew

          echo "Android files:"
          ls -lah android

          if [ -d android/gradle/wrapper ]; then
            ls -lah android/gradle/wrapper
          fi

      - name: Fix Android Gradle Plugin and Gradle versions
        run: |
          cd "$PROJECT_DIR"

          echo "========================================"
          echo "Applying Flutter/AGP compatibility fix"
          echo "========================================"

          python3 <<'PY'
          from pathlib import Path
          import re

          android = Path("android")

          if not android.exists():
              raise SystemExit("ERROR: Android directory not found")

          agp_version = "8.11.1"

          files = [
              android / "settings.gradle",
              android / "settings.gradle.kts",
              android / "build.gradle",
              android / "build.gradle.kts",
          ]

          for path in files:
              if not path.exists():
                  continue

              text = path.read_text()
              original = text

              # plugins block:
              # id "com.android.application" version "x.x.x"
              text = re.sub(
                  r'(id\s*[("\']com\.android\.(?:application|library)[)"\']\s*version\s*[("\'])[^"\']+',
                  r'\g<1>' + agp_version,
                  text
              )

              # Kotlin style:
              # id("com.android.application") version "x.x.x"
              text = re.sub(
                  r'(id\(\s*["\']com\.android\.(?:application|library)["\']\s*\)\s*version\s*["\'])[^"\']+',
                  r'\g<1>' + agp_version,
                  text
              )

              # Old classpath style:
              # classpath "com.android.tools.build:gradle:x.x.x"
              text = re.sub(
                  r'(com\.android\.tools\.build:gradle:)[0-9A-Za-z.\-+]+',
                  r'\g<1>' + agp_version,
                  text
              )

              if text != original:
                  path.write_text(text)
                  print(f"Updated AGP in: {path}")

          wrapper = android / "gradle" / "wrapper" / "gradle-wrapper.properties"

          if wrapper.exists():
              text = wrapper.read_text()

              text = re.sub(
                  r'distributionUrl=.*gradle-[^/]+-(?:bin|all)\.zip',
                  'distributionUrl=https\\://services.gradle.org/distributions/gradle-8.13-bin.zip',
                  text
              )

              wrapper.write_text(text)
              print(f"Updated Gradle wrapper: {wrapper}")
          else:
              print("WARNING: gradle-wrapper.properties not found")
          PY

          echo
          echo "Android Gradle configuration:"
          echo "----------------------------------------"

          find android \
            -maxdepth 2 \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" -o -name "build.gradle" -o -name "build.gradle.kts" \) \
            -type f \
            -print

          echo
          echo "AGP references:"
          grep -R "com.android.tools.build:gradle\|com.android.application\|com.android.library" \
            android \
            --include="*.gradle" \
            --include="*.kts" \
            || true

          echo
          echo "Gradle wrapper:"
          cat android/gradle/wrapper/gradle-wrapper.properties || true

      - name: Verify Gradle wrapper
        run: |
          cd "$PROJECT_DIR/android"

          ./gradlew --version

      - name: Verify Ycash cryptographic sources
        run: |
          cd "$PROJECT_DIR"

          if [ -f scripts/verify_ycash_lock.py ]; then
            python3 scripts/verify_ycash_lock.py
          else
            echo "Ycash verification script not found — skipping."
          fi

      - name: Analyze Flutter project
        run: |
          cd "$PROJECT_DIR"
          flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        run: |
          cd "$PROJECT_DIR"
          flutter test

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"

          flutter build apk --debug

      - name: Build release APK
        run: |
          cd "$PROJECT_DIR"

          flutter build apk --release

      - name: Show generated APKs
        run: |
          cd "$PROJECT_DIR"

          echo "Generated APK files:"

          find build/app/outputs \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Ycash-Wallet-Debug-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Ycash-Wallet-Release-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
