name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract wallet project
        run: |
          echo "Repository contents:"
          ls -la

          if [ ! -f "ycashwallet.zip" ]; then
            echo "ERROR: ycashwallet.zip was not found in the repository root."
            exit 1
          fi

          rm -rf extracted_wallet
          mkdir -p extracted_wallet

          unzip -q ycashwallet.zip -d extracted_wallet

          echo "Extracted Flutter projects:"
          find extracted_wallet -type f -name pubspec.yaml -print

      - name: Find Flutter project
        run: |
          PUBSPEC=$(find extracted_wallet -type f -name pubspec.yaml | head -n 1)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: Could not find pubspec.yaml inside ycashwallet.zip"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Flutter project found at:"
          echo "$PROJECT_DIR"

          ls -la "$PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          dart --version
          java -version

      - name: Get Flutter dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Restore Android host if needed
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
