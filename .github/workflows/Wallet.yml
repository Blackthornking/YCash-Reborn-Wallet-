name: Build Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository contents
        run: |
          echo "Repository contents:"
          ls -lah

          echo ""
          echo "ZIP files:"
          find . -maxdepth 2 -type f -iname "*.zip" -print

      - name: Extract project ZIP
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "Using ZIP file: $ZIP_FILE"

          rm -rf extracted_project
          mkdir -p extracted_project

          unzip -q "$ZIP_FILE" -d extracted_project

          echo ""
          echo "Extracted project files:"

          find extracted_project -maxdepth 10 \
            -type f \
            \( \
              -name "pubspec.yaml" \
              -o -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              -o -name "build.gradle" \
              -o -name "build.gradle.kts" \
              -o -name "libs.versions.toml" \
            \) \
            -print

      - name: Locate Flutter project
        run: |
          set -e

          PROJECT_DIR=$(find "$GITHUB_WORKSPACE/extracted_project" \
            -name pubspec.yaml \
            -type f \
            ! -path "*/packages/*" \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Could not find the main pubspec.yaml."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "Flutter project found at:"
          echo "$PROJECT_DIR"

          ls -lah "$PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865"

      - name: Configure Android environment
        run: |
          set -e

          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-linux-android
            armv7-linux-androideabi
            x86_64-linux-android

      - name: Install cargo-ndk
        run: |
          cargo install cargo-ndk --locked

      - name: Verify toolchains
        run: |
          echo "=== Java ==="
          java -version

          echo ""
          echo "=== Flutter ==="
          flutter --version

          echo ""
          echo "=== Rust ==="
          rustc --version
          cargo --version
          cargo ndk --version

          echo ""
          echo "=== Android SDK ==="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865"

      - name: Get Flutter dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter pub get

      - name: Check project structure
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=== Flutter project ==="
          ls -lah

          echo ""
          echo "=== Android Gradle files ==="

          find android -type f \
            \( \
              -name "*.gradle" \
              -o -name "*.gradle.kts" \
              -o -name "*.toml" \
              -o -name "gradle.properties" \
              -o -name "gradle-wrapper.properties" \
            \) \
            -print

      - name: Fix AGP 9 incompatibility
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "========================================"
          echo "ANDROID GRADLE CONFIGURATION BEFORE PATCH"
          echo "========================================"

          echo ""
          echo "--- All AGP / Android plugin references ---"

          grep -Rni \
            -E \
            'com\.android\.application|com\.android\.library|com\.android\.tools\.build|androidGradlePlugin|agp[[:space:]]*=|agp[[:space:]]*=' \
            android \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            --include="*.toml" || true

          echo ""
          echo "--- All 9.x references in Android configuration ---"

          grep -Rni \
            -E \
            '9\.[0-9]+' \
            android \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            --include="*.toml" || true

          echo ""
          echo "========================================"
          echo "REMOVING android.newDsl"
          echo "========================================"

          touch android/gradle.properties

          sed -i \
            '/^[[:space:]]*android\.newDsl[[:space:]]*=/d' \
            android/gradle.properties

          echo ""
          echo "========================================"
          echo "SETTING GRADLE TO 8.10.2"
          echo "========================================"

          if [ -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then
            sed -i \
              's#^distributionUrl=.*#distributionUrl=https\://services.gradle.org/distributions/gradle-8.10.2-bin.zip#' \
              android/gradle/wrapper/gradle-wrapper.properties
          fi

          echo ""
          echo "========================================"
          echo "REPLACING AGP 9 WITH AGP 8.8.2"
          echo "========================================"

          python3 <<'PYTHON'
          import os
          import re

          AGP_VERSION = "8.8.2"

          extensions = (
              ".gradle",
              ".gradle.kts",
              ".toml",
          )

          files = []

          for root, dirs, filenames in os.walk("android"):
              for filename in filenames:
                  if filename.endswith(extensions):
                      files.append(os.path.join(root, filename))

          print("Files being checked:")
          for path in files:
              print(" -", path)

          for path in files:
              with open(path, "r", encoding="utf-8") as f:
                  original = f.read()

              text = original

              # Groovy classpath format:
              # com.android.tools.build:gradle:9.x.x
              text = re.sub(
                  r'com\.android\.tools\.build:gradle:9\.[0-9.]+',
                  f'com.android.tools.build:gradle:{AGP_VERSION}',
                  text
              )

              # Kotlin DSL:
              # id("com.android.application") version "9.x.x"
              text = re.sub(
                  r'(id\(\s*["\']com\.android\.application["\']\s*\)\s*version\s*["\'])9\.[0-9.]+',
                  rf'\g<1>{AGP_VERSION}',
                  text
              )

              text = re.sub(
                  r'(id\(\s*["\']com\.android\.library["\']\s*\)\s*version\s*["\'])9\.[0-9.]+',
                  rf'\g<1>{AGP_VERSION}',
                  text
              )

              # Groovy plugins:
              # id 'com.android.application' version '9.x.x'
              text = re.sub(
                  r'(id\s+["\']com\.android\.application["\']\s+version\s+["\'])9\.[0-9.]+',
                  rf'\g<1>{AGP_VERSION}',
                  text
              )

              text = re.sub(
                  r'(id\s+["\']com\.android\.library["\']\s+version\s+["\'])9\.[0-9.]+',
                  rf'\g<1>{AGP_VERSION}',
                  text
              )

              # Version catalog:
              # agp = "9.x.x"
              text = re.sub(
                  r'(^\s*agp\s*=\s*["\'])9\.[0-9.]+',
                  rf'\g<1>{AGP_VERSION}',
                  text,
                  flags=re.MULTILINE
              )

              # androidGradlePlugin = "9.x.x"
              text = re.sub(
                  r'(^\s*androidGradlePlugin\s*=\s*["\'])9\.[0-9.]+',
                  rf'\g<1>{AGP_VERSION}',
                  text,
                  flags=re.MULTILINE
              )

              if text != original:
                  print(f"PATCHED: {path}")

                  with open(path, "w", encoding="utf-8") as f:
                      f.write(text)

          print("")
          print("AGP patch completed.")
          PYTHON

          echo ""
          echo "========================================"
          echo "ANDROID GRADLE CONFIGURATION AFTER PATCH"
          echo "========================================"

          echo ""
          echo "--- gradle.properties ---"
          cat android/gradle.properties || true

          echo ""
          echo "--- gradle-wrapper.properties ---"
          cat android/gradle/wrapper/gradle-wrapper.properties || true

          echo ""
          echo "--- Final Android plugin references ---"

          grep -Rni \
            -E \
            'com\.android\.application|com\.android\.library|com\.android\.tools\.build|androidGradlePlugin|agp[[:space:]]*=' \
            android \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            --include="*.toml" || true

          echo ""
          echo "========================================"
          echo "CHECKING FOR REMAINING AGP 9 REFERENCES"
          echo "========================================"

          if grep -Rni \
            -E \
            '(com\.android\.application|com\.android\.library|com\.android\.tools\.build:gradle|androidGradlePlugin|agp).*9\.' \
            android \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            --include="*.toml"; then

            echo ""
            echo "ERROR: AGP 9 reference still exists."
            exit 1
          fi

          echo ""
          echo "SUCCESS: No AGP 9 references detected."

      - name: Clean Flutter and Gradle caches
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          flutter clean

          rm -rf android/.gradle
          rm -rf .gradle

          flutter pub get

      - name: Verify Gradle version
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          chmod +x gradlew

          ./gradlew --version

      - name: Build Flutter APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter build apk \
            --release \
            --verbose

      - name: Show generated APK files
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "Generated APK files:"

          find build/app/outputs/flutter-apk \
            -type f \
            -name "*.apk" \
            -print \
            -exec ls -lh {} \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ycash-Wallet-Release-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30
