name: Build Flutter Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: phase54/phase48

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          dart --version
          java -version

      - name: Verify project layout
        run: |
          test -f pubspec.yaml
          test -f scripts/verify_ycash_lock.py
          test -d packages/ycash_core_ffi

      - name: Verify pinned Ycash cryptographic sources
        run: python3 scripts/verify_ycash_lock.py

      - name: Restore Android host
        run: |
          rm -rf android
          flutter create --platforms=android --org com.ycashfoundation .
          test -f android/gradle/wrapper/gradle-wrapper.properties

      - name: Pin Gradle wrapper to Flutter minimum
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/gradle/wrapper/gradle-wrapper.properties")
          if not p.exists():
              raise SystemExit(f"Missing {p}")

          s = p.read_text()
          s = re.sub(
              r"^distributionUrl=.*$",
              "distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14-bin.zip",
              s,
              flags=re.MULTILINE,
          )
          if "distributionUrl=" not in s:
              s += "\ndistributionUrl=https\\://services.gradle.org/distributions/gradle-8.14-bin.zip\n"
          p.write_text(s)

          print("Pinned Gradle wrapper:")
          print(p.read_text())

          if "gradle-8.14-bin.zip" not in p.read_text():
              raise SystemExit("Gradle 8.14 pin failed")
          PY
          chmod +x android/gradlew

      - name: Verify Flutter and Gradle compatibility
        working-directory: phase54/phase48/android
        run: |
          grep -q "gradle-8.14-bin.zip" gradle/wrapper/gradle-wrapper.properties
          ./gradlew --version

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter project
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build debug APK
        run: |
          grep -q "gradle-8.14-bin.zip" android/gradle/wrapper/gradle-wrapper.properties
          flutter build apk --debug

      - name: Build release APK
        run: |
          grep -q "gradle-8.14-bin.zip" android/gradle/wrapper/gradle-wrapper.properties
          flutter build apk --release

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Ycash-Wallet-Debug-APK
          path: phase54/phase48/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Ycash-Wallet-Release-APK
          path: phase54/phase48/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
