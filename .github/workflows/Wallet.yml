      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-linux-android
            armv7-linux-androideabi
            x86_64-linux-android

      - name: Install cargo-ndk
        run: |
          cargo install cargo-ndk --locked

      - name: Configure Android NDK for Rust
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV

          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME"

      - name: Verify Rust and Android setup
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"

          rustc --version
          cargo --version
          cargo ndk --version

          echo "Android NDK:"
          echo "$ANDROID_NDK_LATEST_HOME"

          test -d "$ANDROID_NDK_LATEST_HOME"

      - name: Verify Ycash cryptographic sources
        run: |
          cd "$PROJECT_DIR"

          if [ -f scripts/verify_ycash_lock.py ]; then
            python3 scripts/verify_ycash_lock.py
          else
            echo "Ycash verification script not found — skipping."
          fi

      - name: Analyze Flutter project
        run: |
          cd "$PROJECT_DIR"
          flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        run: |
          cd "$PROJECT_DIR"
          flutter test

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"

          export PATH="$HOME/.cargo/bin:$PATH"

          flutter build apk --debug --verbose

      - name: Build release APK
        run: |
          cd "$PROJECT_DIR"

          export PATH="$HOME/.cargo/bin:$PATH"

          flutter build apk --release --verbose

      - name: Show generated APKs
        run: |
          cd "$PROJECT_DIR"

          echo "Generated APK files:"
          find build/app/outputs -type f -name "*.apk" -print

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Ycash-Wallet-Debug-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Ycash-Wallet-Release-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
