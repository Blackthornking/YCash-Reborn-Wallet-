name: Build Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository contents
        run: |
          echo "Repository contents:"
          ls -lah

          echo ""
          echo "ZIP files:"
          find . -maxdepth 2 -type f -iname "*.zip" -print

      - name: Extract project ZIP
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "Using ZIP file: $ZIP_FILE"

          rm -rf extracted_project
          mkdir -p extracted_project

          unzip -q "$ZIP_FILE" -d extracted_project

          echo ""
          echo "=== Extracted directory structure ==="

          find extracted_project -maxdepth 4 -type d -print

          echo ""
          echo "=== Important project files ==="

          find extracted_project -maxdepth 10 \
            -type f \
            \( \
              -name "pubspec.yaml" \
              -o -name "gradlew" \
              -o -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              -o -name "build.gradle" \
              -o -name "build.gradle.kts" \
              -o -name "libs.versions.toml" \
            \) \
            -print

      - name: Locate Flutter project
        run: |
          set -e

          SEARCH_ROOT="$GITHUB_WORKSPACE/extracted_project"

          echo "Searching for Flutter projects..."

          PROJECT_DIR=""

          # First preference:
          # A Flutter project containing android/gradlew
          while IFS= read -r PUBSPEC; do
            DIR=$(dirname "$PUBSPEC")

            if [ -f "$DIR/android/gradlew" ]; then
              PROJECT_DIR="$DIR"
              echo "Found Flutter project with Gradle wrapper:"
              echo "$PROJECT_DIR"
              break
            fi
          done < <(
            find "$SEARCH_ROOT" \
              -type f \
              -name pubspec.yaml \
              ! -path "*/.dart_tool/*" \
              ! -path "*/build/*"
          )

          # Second preference:
          # A Flutter project containing an android directory
          if [ -z "$PROJECT_DIR" ]; then
            while IFS= read -r PUBSPEC; do
              DIR=$(dirname "$PUBSPEC")

              if [ -d "$DIR/android" ]; then
                PROJECT_DIR="$DIR"
                echo "Found Flutter project with Android directory:"
                echo "$PROJECT_DIR"
                break
              fi
            done < <(
              find "$SEARCH_ROOT" \
                -type f \
                -name pubspec.yaml \
                ! -path "*/.dart_tool/*" \
                ! -path "*/build/*"
            )
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Could not find a Flutter project with an Android directory."

            echo ""
            echo "All pubspec.yaml files found:"
            find "$SEARCH_ROOT" -type f -name pubspec.yaml -print

            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "========================================"
          echo "FLUTTER PROJECT FOUND"
          echo "========================================"
          echo "$PROJECT_DIR"

          echo ""
          echo "=== Project contents ==="
          ls -lah "$PROJECT_DIR"

          echo ""
          echo "=== Android contents ==="
          ls -lah "$PROJECT_DIR/android" || true

          echo ""
          echo "=== Looking for Gradle wrapper ==="
          find "$PROJECT_DIR/android" -maxdepth 3 -type f -name "gradlew" -print

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865"

      - name: Configure Android environment
        run: |
          set -e

          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-linux-android
            armv7-linux-androideabi
            x86_64-linux-android

      - name: Install cargo-ndk
        run: |
          cargo install cargo-ndk --locked

      - name: Verify toolchains
        run: |
          echo "=== Java ==="
          java -version

          echo ""
          echo "=== Flutter ==="
          flutter --version

          echo ""
          echo "=== Rust ==="
          rustc --version
          cargo --version
          cargo ndk --version

          echo ""
          echo "=== Android SDK ==="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865"

      - name: Get Flutter dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter pub get

      - name: Check project structure
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=== Flutter project ==="
          ls -lah

          echo ""
          echo "=== Android directory ==="
          ls -lah android

          echo ""
          echo "=== Android Gradle files ==="

          find android -type f \
            \( \
              -name "gradlew" \
              -o -name "*.gradle" \
              -o -name "*.gradle.kts" \
              -o -name "*.toml" \
              -o -name "gradle.properties" \
              -o -name "gradle-wrapper.properties" \
            \) \
            -print

      - name: Fix AGP 9 incompatibility
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "========================================"
          echo "ANDROID GRADLE CONFIGURATION BEFORE PATCH"
          echo "========================================"

          grep -Rni \
            -E \
            'com\.android\.application|com\.android\.library|com\.android\.tools\.build|androidGradlePlugin|agp[[:space:]]*=' \
            android \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            --include="*.toml" || true

          echo ""
          echo "Removing android.newDsl..."

          touch android/gradle.properties

          sed -i \
            '/^[[:space:]]*android\.newDsl[[:space:]]*=/d' \
            android/gradle.properties

          echo ""
          echo "Setting Gradle to 8.10.2..."

          if [ -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then
            sed -i \
              's#^distributionUrl=.*#distributionUrl=https\://services.gradle.org/distributions/gradle-8.10.2-bin.zip#' \
              android/gradle/wrapper/gradle-wrapper.properties
          else
            echo "WARNING: gradle-wrapper.properties not found."
          fi

          echo ""
          echo "Replacing AGP 9 with AGP 8.8.2..."

          python3 <<'PYTHON'
          import os
          import re

          AGP_VERSION = "8.8.2"

          extensions = (
              ".gradle",
              ".gradle.kts",
              ".toml",
          )

          files = []

          for root, dirs, filenames in os.walk("android"):
              for filename in filenames:
                  if filename.endswith(extensions):
                      files.append(os.path.join(root, filename))

          for path in files:
              with open(path, "r", encoding="utf-8") as f:
                  original = f.read()

              text = original

              text = re.sub(
                  r'com\.android\.tools\.build:gradle:9\.[0-9.]+',
                  f'com.android.tools.build:gradle:{AGP_VERSION}',
                  text
              )

              text = re.sub(
                  r'(id\(\s*["\']com\.android\.application["\']\s*\)\s*version\s*["\'])9\.[0-9.]+',
                  rf'\g<1>{AGP_VERSION}',
                  text
              )

              text = re.sub(
                  r'(id\(\s*["\']com\.android\.library["\']\s*\)\s*version\s*["\'])9\.[0-9.]+',
                  rf'\g<1>{AGP_VERSION}',
                  text
              )

              text = re.sub(
                  r'(id\s+["\']com\.android\.application["\']\s+version\s+["\'])9\.[0-9.]+',
                  rf'\g<1>{AGP_VERSION}',
                  text
              )

              text = re.sub(
                  r'(id\s+["\']com\.android\.library["\']\s+version\s+["\'])9\.[0-9.]+',
                  rf'\g<1>{AGP_VERSION}',
                  text
              )

              text = re.sub(
                  r'(^\s*agp\s*=\s*["\'])9\.[0-9.]+',
                  rf'\g<1>{AGP_VERSION}',
                  text,
                  flags=re.MULTILINE
              )

              text = re.sub(
                  r'(^\s*androidGradlePlugin\s*=\s*["\'])9\.[0-9.]+',
                  rf'\g<1>{AGP_VERSION}',
                  text,
                  flags=re.MULTILINE
              )

              if text != original:
                  print(f"PATCHED: {path}")

                  with open(path, "w", encoding="utf-8") as f:
                      f.write(text)

          print("AGP patch completed.")
          PYTHON

          echo ""
          echo "=== Final Gradle wrapper configuration ==="

          cat android/gradle/wrapper/gradle-wrapper.properties || true

          echo ""
          echo "=== Checking for remaining AGP 9 references ==="

          if grep -Rni \
            -E \
            '(com\.android\.application|com\.android\.library|com\.android\.tools\.build:gradle|androidGradlePlugin|agp).*9\.' \
            android \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            --include="*.toml"; then

            echo ""
            echo "ERROR: AGP 9 reference still exists."
            exit 1
          fi

          echo "SUCCESS: No AGP 9 references detected."

      - name: Clean Flutter and Gradle caches
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          flutter clean

          rm -rf android/.gradle
          rm -rf .gradle

          flutter pub get

      - name: Verify Gradle wrapper and version
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          set -e

          echo "Current directory:"
          pwd

          echo ""
          echo "Directory contents:"
          ls -lah

          echo ""

          if [ ! -f "./gradlew" ]; then
            echo "ERROR: Gradle wrapper (android/gradlew) was not found."

            echo ""
            echo "Files inside Android directory:"
            find . -maxdepth 3 -type f -print | sort

            exit 1
          fi

          chmod +x ./gradlew

          echo "=== Gradle version ==="
          ./gradlew --version

      - name: Build Flutter APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter build apk \
            --release \
            --verbose

      - name: Show generated APK files
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "Generated APK files:"

          find build/app/outputs/flutter-apk \
            -type f \
            -name "*.apk" \
            -print \
            -exec ls -lh {} \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ycash-Wallet-Release-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30
