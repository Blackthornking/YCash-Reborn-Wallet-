name: Build Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # ========================================
      # CHECKOUT
      # ========================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ========================================
      # SHOW FILES
      # ========================================

      - name: Show repository contents
        run: |
          echo "========================================"
          echo "REPOSITORY CONTENTS"
          echo "========================================"

          ls -lah

          echo ""
          echo "ZIP files found:"

          find . \
            -maxdepth 3 \
            -type f \
            -iname "*.zip" \
            -print


      # ========================================
      # EXTRACT ZIP
      # ========================================

      - name: Extract project ZIP
        run: |
          set -e

          echo "========================================"
          echo "LOCATING PROJECT ZIP"
          echo "========================================"

          ZIP_FILE=$(find . \
            -maxdepth 3 \
            -type f \
            -iname "*.zip" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file was found."
            exit 1
          fi

          echo "Using ZIP:"
          echo "$ZIP_FILE"

          rm -rf extracted_project
          mkdir -p extracted_project

          unzip -q "$ZIP_FILE" -d extracted_project

          echo ""
          echo "========================================"
          echo "EXTRACTED DIRECTORIES"
          echo "========================================"

          find extracted_project \
            -maxdepth 5 \
            -type d \
            -print

          echo ""
          echo "========================================"
          echo "IMPORTANT FILES"
          echo "========================================"

          find extracted_project \
            -maxdepth 10 \
            -type f \
            \( \
              -name "pubspec.yaml" \
              -o -name "gradlew" \
              -o -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              -o -name "build.gradle" \
              -o -name "build.gradle.kts" \
              -o -name "gradle-wrapper.properties" \
            \) \
            -print


      # ========================================
      # LOCATE FLUTTER PROJECT
      # ========================================

      - name: Locate Flutter project
        run: |
          set -e

          SEARCH_ROOT="$GITHUB_WORKSPACE/extracted_project"

          echo "Searching for Flutter project..."

          PROJECT_DIR=""

          while IFS= read -r PUBSPEC; do

            DIR=$(dirname "$PUBSPEC")

            echo "Checking:"
            echo "$DIR"

            if [ -d "$DIR/android" ]; then

              PROJECT_DIR="$DIR"

              echo ""
              echo "Flutter project found:"
              echo "$PROJECT_DIR"

              break
            fi

          done < <(
            find "$SEARCH_ROOT" \
              -type f \
              -name "pubspec.yaml" \
              ! -path "*/.dart_tool/*" \
              ! -path "*/build/*"
          )

          if [ -z "$PROJECT_DIR" ]; then

            echo "ERROR: Could not locate Flutter project."

            echo ""
            echo "pubspec.yaml files found:"

            find "$SEARCH_ROOT" \
              -type f \
              -name "pubspec.yaml" \
              -print

            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "========================================"
          echo "PROJECT STRUCTURE"
          echo "========================================"

          echo "Project:"
          echo "$PROJECT_DIR"

          echo ""
          echo "--- Project files ---"

          ls -lah "$PROJECT_DIR"

          echo ""
          echo "--- Android files ---"

          ls -lah "$PROJECT_DIR/android"


      # ========================================
      # JAVA
      # ========================================

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ========================================
      # ANDROID SDK
      # ========================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;29.0.14206865"


      # ========================================
      # ANDROID ENVIRONMENT
      # ========================================

      - name: Configure Android environment
        run: |
          set -e

          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"


      # ========================================
      # FLUTTER
      # ========================================

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true


      # ========================================
      # RUST
      # ========================================

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-linux-android
            armv7-linux-androideabi
            x86_64-linux-android

      - name: Install cargo-ndk
        run: |
          cargo install cargo-ndk --locked


      # ========================================
      # VERIFY TOOLS
      # ========================================

      - name: Verify toolchains
        run: |
          echo "========================================"
          echo "JAVA"
          echo "========================================"

          java -version

          echo ""
          echo "========================================"
          echo "FLUTTER"
          echo "========================================"

          flutter --version

          echo ""
          echo "========================================"
          echo "RUST"
          echo "========================================"

          rustc --version
          cargo --version
          cargo ndk --version

          echo ""
          echo "========================================"
          echo "ANDROID"
          echo "========================================"

          echo "ANDROID_HOME=$ANDROID_HOME"

          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865"


      # ========================================
      # FLUTTER DEPENDENCIES
      # ========================================

      - name: Get Flutter dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter pub get


      # ========================================
      # SHOW ANDROID CONFIG
      # ========================================

      - name: Check Android project structure
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "========================================"
          echo "ANDROID DIRECTORY"
          echo "========================================"

          find android \
            -maxdepth 4 \
            -type f \
            -print \
            | sort

          echo ""
          echo "========================================"
          echo "ANDROID DIRECTORY CONTENTS"
          echo "========================================"

          ls -lah android


      # ========================================
      # CREATE GRADLE WRAPPER IF MISSING
      # ========================================

      - name: Create Gradle wrapper if missing
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "========================================"
          echo "CHECKING GRADLE WRAPPER"
          echo "========================================"

          ls -lah android

          if [ -f "android/gradlew" ]; then

            echo ""
            echo "Gradle wrapper already exists."

            chmod +x android/gradlew

            exit 0
          fi

          echo ""
          echo "Gradle wrapper is missing."
          echo "Creating a standalone minimal Gradle project..."

          TEMP_DIR=$(mktemp -d)

          echo "Temporary directory:"
          echo "$TEMP_DIR"

          mkdir -p "$TEMP_DIR/gradle"

          cat > "$TEMP_DIR/settings.gradle.kts" <<'EOF'
          rootProject.name = "wrapper-generator"
          EOF

          cat > "$TEMP_DIR/build.gradle.kts" <<'EOF'
          plugins {
          }
          EOF

          echo ""
          echo "Downloading Gradle 8.9..."

          curl \
            --fail \
            --location \
            --retry 3 \
            --output "$TEMP_DIR/gradle-8.9-bin.zip" \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip

          unzip -q \
            "$TEMP_DIR/gradle-8.9-bin.zip" \
            -d "$TEMP_DIR"

          echo ""
          echo "Generating Gradle wrapper..."

          (
            cd "$TEMP_DIR"

            "./gradle-8.9/bin/gradle" \
              wrapper \
              --gradle-version 8.9 \
              --distribution-type bin \
              --no-daemon
          )

          echo ""
          echo "Generated wrapper files:"

          find "$TEMP_DIR" \
            -maxdepth 4 \
            -type f \
            \( \
              -name "gradlew" \
              -o -name "gradlew.bat" \
              -o -name "gradle-wrapper.jar" \
              -o -name "gradle-wrapper.properties" \
            \) \
            -print

          echo ""
          echo "Copying wrapper into Flutter Android project..."

          mkdir -p android/gradle/wrapper

          cp "$TEMP_DIR/gradlew" \
            android/gradlew

          cp "$TEMP_DIR/gradlew.bat" \
            android/gradlew.bat

          cp "$TEMP_DIR/gradle/wrapper/gradle-wrapper.jar" \
            android/gradle/wrapper/gradle-wrapper.jar

          cp "$TEMP_DIR/gradle/wrapper/gradle-wrapper.properties" \
            android/gradle/wrapper/gradle-wrapper.properties

          chmod +x android/gradlew

          echo ""
          echo "========================================"
          echo "GRADLE WRAPPER CREATED SUCCESSFULLY"
          echo "========================================"

          find android \
            -maxdepth 3 \
            -type f \
            \( \
              -name "gradlew" \
              -o -name "gradle-wrapper.jar" \
              -o -name "gradle-wrapper.properties" \
            \) \
            -print


      # ========================================
      # FIX AGP 9
      # ========================================

      - name: Fix AGP 9 incompatibility
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "========================================"
          echo "ANDROID CONFIGURATION BEFORE PATCH"
          echo "========================================"

          grep -Rni \
            -E \
            'com\.android\.application|com\.android\.library|com\.android\.tools\.build|androidGradlePlugin|agp[[:space:]]*=' \
            android \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            --include="*.toml" || true

          echo ""
          echo "Removing incompatible android.newDsl..."

          touch android/gradle.properties

          sed -i \
            '/^[[:space:]]*android\.newDsl[[:space:]]*=/d' \
            android/gradle.properties

          echo ""
          echo "Setting Gradle wrapper to 8.9..."

          sed -i \
            's#^distributionUrl=.*#distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip#' \
            android/gradle/wrapper/gradle-wrapper.properties

          echo ""
          echo "Replacing AGP 9 with AGP 8.7.3..."

          python3 <<'PYTHON'
          import os
          import re

          AGP_VERSION = "8.7.3"

          extensions = (
              ".gradle",
              ".gradle.kts",
              ".toml",
          )

          for root, dirs, filenames in os.walk("android"):

              for filename in filenames:

                  if not filename.endswith(extensions):
                      continue

                  path = os.path.join(root, filename)

                  with open(path, "r", encoding="utf-8") as f:
                      original = f.read()

                  text = original

                  # Traditional Gradle classpath
                  text = re.sub(
                      r'com\.android\.tools\.build:gradle:9\.[0-9.]+',
                      f'com.android.tools.build:gradle:{AGP_VERSION}',
                      text
                  )

                  # Kotlin DSL application plugin
                  text = re.sub(
                      r'(id\(\s*["\']com\.android\.application["\']\s*\)\s*version\s*["\'])9\.[0-9.]+',
                      rf'\g<1>{AGP_VERSION}',
                      text
                  )

                  # Kotlin DSL library plugin
                  text = re.sub(
                      r'(id\(\s*["\']com\.android\.library["\']\s*\)\s*version\s*["\'])9\.[0-9.]+',
                      rf'\g<1>{AGP_VERSION}',
                      text
                  )

                  # Groovy application plugin
                  text = re.sub(
                      r'(id\s+["\']com\.android\.application["\']\s+version\s+["\'])9\.[0-9.]+',
                      rf'\g<1>{AGP_VERSION}',
                      text
                  )

                  # Groovy library plugin
                  text = re.sub(
                      r'(id\s+["\']com\.android\.library["\']\s+version\s+["\'])9\.[0-9.]+',
                      rf'\g<1>{AGP_VERSION}',
                      text
                  )

                  # Version catalog
                  text = re.sub(
                      r'(^\s*agp\s*=\s*["\'])9\.[0-9.]+',
                      rf'\g<1>{AGP_VERSION}',
                      text,
                      flags=re.MULTILINE
                  )

                  # Alternative version variable
                  text = re.sub(
                      r'(^\s*androidGradlePlugin\s*=\s*["\'])9\.[0-9.]+',
                      rf'\g<1>{AGP_VERSION}',
                      text,
                      flags=re.MULTILINE
                  )

                  if text != original:

                      print(f"PATCHED: {path}")

                      with open(path, "w", encoding="utf-8") as f:
                          f.write(text)

          print("")
          print("AGP patch completed.")
          PYTHON


      # ========================================
      # VERIFY AGP
      # ========================================

      - name: Verify Android Gradle configuration
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "========================================"
          echo "GRADLE WRAPPER"
          echo "========================================"

          cat android/gradle/wrapper/gradle-wrapper.properties

          echo ""
          echo "========================================"
          echo "FINAL AGP REFERENCES"
          echo "========================================"

          grep -Rni \
            -E \
            'com\.android\.application|com\.android\.library|com\.android\.tools\.build|androidGradlePlugin|agp[[:space:]]*=' \
            android \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            --include="*.toml" || true

          echo ""
          echo "========================================"
          echo "CHECKING FOR AGP 9"
          echo "========================================"

          if grep -Rni \
            -E \
            '(com\.android\.application|com\.android\.library|com\.android\.tools\.build:gradle|androidGradlePlugin|agp).*9\.' \
            android \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            --include="*.toml"; then

            echo ""
            echo "ERROR: AGP 9 reference still exists."

            exit 1
          fi

          echo ""
          echo "SUCCESS: No AGP 9 references found."


      # ========================================
      # CLEAN
      # ========================================

      - name: Clean Flutter and Gradle caches
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          flutter clean

          rm -rf android/.gradle
          rm -rf .gradle

          flutter pub get


      # ========================================
      # VERIFY WRAPPER
      # ========================================

      - name: Verify Gradle wrapper
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          set -e

          echo "========================================"
          echo "ANDROID DIRECTORY"
          echo "========================================"

          pwd

          ls -lah

          echo ""

          if [ ! -f "./gradlew" ]; then
            echo "ERROR: gradlew is still missing."

            find . \
              -maxdepth 4 \
              -type f \
              -print \
              | sort

            exit 1
          fi

          chmod +x ./gradlew

          echo ""
          echo "========================================"
          echo "GRADLE VERSION"
          echo "========================================"

          ./gradlew --version


      # ========================================
      # BUILD APK
      # ========================================

      - name: Build Flutter APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          flutter build apk \
            --release \
            --verbose


      # ========================================
      # SHOW APK
      # ========================================

      - name: Show generated APK files
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "========================================"
          echo "GENERATED APK FILES"
          echo "========================================"

          find build/app/outputs \
            -type f \
            -name "*.apk" \
            -print \
            -exec ls -lh {} \;


      # ========================================
      # UPLOAD APK
      # ========================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ycash-Wallet-Release-APK
          path: |
            ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/*.apk
            ${{ env.PROJECT_DIR }}/build/app/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
