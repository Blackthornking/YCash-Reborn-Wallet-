name: Build Flutter Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: phase48

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          dart --version
          java -version

      - name: Verify project layout
        run: |
          test -f pubspec.yaml
          test -f android/settings.gradle.kts
          test -f android/build.gradle.kts
          test -f android/app/build.gradle.kts
          test -f scripts/verify_ycash_lock.py
          test -d packages/ycash_core_ffi

      - name: Verify pinned Ycash cryptographic sources
        run: python3 scripts/verify_ycash_lock.py

      # Keep the repository's Android build files. Regenerating the whole Android
      # host with a newer Flutter template can silently introduce AGP 9+, which is
      # incompatible with the Flutter Gradle plugin configuration used by this app.
      - name: Ensure Gradle wrapper exists
        run: |
          if [ ! -f android/gradle/wrapper/gradle-wrapper.jar ] || [ ! -f android/gradlew ]; then
            echo "Generating missing Gradle wrapper files while preserving project Gradle configuration..."
            mkdir -p /tmp/ycash-android-backup
            cp android/settings.gradle.kts /tmp/ycash-android-backup/settings.gradle.kts
            cp android/build.gradle.kts /tmp/ycash-android-backup/build.gradle.kts
            cp android/app/build.gradle.kts /tmp/ycash-android-backup/app-build.gradle.kts
            cp android/gradle.properties /tmp/ycash-android-backup/gradle.properties

            flutter create --platforms=android --org com.ycashfoundation .

            cp /tmp/ycash-android-backup/settings.gradle.kts android/settings.gradle.kts
            cp /tmp/ycash-android-backup/build.gradle.kts android/build.gradle.kts
            cp /tmp/ycash-android-backup/app-build.gradle.kts android/app/build.gradle.kts
            cp /tmp/ycash-android-backup/gradle.properties android/gradle.properties
          fi

      - name: Pin Android Gradle Plugin and Gradle wrapper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          settings = Path("android/settings.gradle.kts")
          text = settings.read_text()
          text = re.sub(
              r'id\("com\.android\.application"\) version "[^"]+" apply false',
              'id("com.android.application") version "8.7.3" apply false',
              text,
          )
          text = re.sub(
              r'id\("org\.jetbrains\.kotlin\.android"\) version "[^"]+" apply false',
              'id("org.jetbrains.kotlin.android") version "2.1.0" apply false',
              text,
          )
          settings.write_text(text)

          wrapper = Path("android/gradle/wrapper/gradle-wrapper.properties")
          if not wrapper.exists():
              raise SystemExit("Gradle wrapper properties were not generated")
          wtext = wrapper.read_text()
          wtext = re.sub(r'gradle-[0-9.]+-(?:bin|all)\.zip', 'gradle-8.14-bin.zip', wtext)
          wrapper.write_text(wtext)

          print("Pinned AGP 8.7.3, Kotlin 2.1.0, Gradle 8.14")
          PY

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter project
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        run: flutter test

      - name: Make Gradle wrapper executable
        run: |
          if [ -f android/gradlew ]; then
            chmod +x android/gradlew
          fi

      - name: Verify Gradle version
        working-directory: phase48/android
        run: ./gradlew --version

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Ycash-Wallet-Debug-APK
          path: phase48/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Ycash-Wallet-Release-APK
          path: phase48/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
