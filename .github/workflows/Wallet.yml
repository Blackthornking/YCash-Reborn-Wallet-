name: Build Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # ========================================
      # CHECKOUT
      # ========================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ========================================
      # CHECK ZIP
      # ========================================

      - name: Check repository contents
        run: |
          set -e

          echo "========================================"
          echo "REPOSITORY CONTENTS"
          echo "========================================"

          ls -lah

          echo ""

          if [ ! -f "ycashwallet.zip" ]; then
            echo "ERROR: ycashwallet.zip was not found."
            exit 1
          fi

          echo "SUCCESS: ycashwallet.zip found."


      # ========================================
      # EXTRACT ZIP
      # ========================================

      - name: Extract project ZIP
        run: |
          set -e

          echo "========================================"
          echo "EXTRACTING ycashwallet.zip"
          echo "========================================"

          rm -rf extracted_project
          mkdir -p extracted_project

          unzip -q ycashwallet.zip -d extracted_project

          echo ""
          echo "Extraction complete."

          echo ""
          echo "Searching for Flutter projects..."

          find extracted_project \
            -maxdepth 10 \
            -type f \
            -name "pubspec.yaml" \
            -print


      # ========================================
      # LOCATE FLUTTER PROJECT
      # ========================================

      - name: Locate Flutter project
        run: |
          set -e

          SEARCH_ROOT="$GITHUB_WORKSPACE/extracted_project"

          PROJECT_DIR=""

          while IFS= read -r PUBSPEC; do

            DIR=$(dirname "$PUBSPEC")

            echo "Checking: $DIR"

            if [ -d "$DIR/android" ]; then
              PROJECT_DIR="$DIR"
              break
            fi

          done < <(
            find "$SEARCH_ROOT" \
              -type f \
              -name "pubspec.yaml" \
              ! -path "*/.dart_tool/*" \
              ! -path "*/build/*"
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Could not locate Flutter project."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "========================================"
          echo "FLUTTER PROJECT FOUND"
          echo "========================================"

          echo "$PROJECT_DIR"

          echo ""
          echo "PROJECT FILES:"
          ls -lah "$PROJECT_DIR"

          echo ""
          echo "ANDROID FILES:"
          ls -lah "$PROJECT_DIR/android"


      # ========================================
      # JAVA
      # ========================================

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ========================================
      # ANDROID SDK
      # ========================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          set -e

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;29.0.14206865"


      # ========================================
      # ANDROID ENVIRONMENT
      # ========================================

      - name: Configure Android environment
        run: |
          set -e

          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"


      # ========================================
      # FLUTTER
      # ========================================

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true


      # ========================================
      # RUST
      # ========================================

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-linux-android
            armv7-linux-androideabi
            x86_64-linux-android


      - name: Install cargo-ndk
        run: |
          cargo install cargo-ndk --locked


      # ========================================
      # VERIFY TOOLS
      # ========================================

      - name: Verify toolchains
        run: |
          set -e

          echo "========================================"
          echo "JAVA"
          echo "========================================"

          java -version

          echo ""
          echo "========================================"
          echo "FLUTTER"
          echo "========================================"

          flutter --version

          echo ""
          echo "========================================"
          echo "RUST"
          echo "========================================"

          rustc --version
          cargo --version
          cargo ndk --version

          echo ""
          echo "========================================"
          echo "ANDROID SDK"
          echo "========================================"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865"


      # ========================================
      # CREATE GRADLE WRAPPER IF MISSING
      # ========================================

      - name: Create Gradle wrapper if missing
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "========================================"
          echo "CHECKING GRADLE WRAPPER"
          echo "========================================"

          if [ -f "android/gradlew" ] && \
             [ -f "android/gradle/wrapper/gradle-wrapper.jar" ]; then

            echo "SUCCESS: Gradle wrapper already exists."

            chmod +x android/gradlew

            exit 0
          fi

          echo ""
          echo "Gradle wrapper is missing."
          echo "Creating Gradle 8.9 wrapper..."

          GRADLE_VERSION="8.9"
          TEMP_DIR=$(mktemp -d)

          echo "Temporary directory:"
          echo "$TEMP_DIR"

          cd "$TEMP_DIR"

          echo 'rootProject.name = "wrapper-generator"' > settings.gradle
          echo '' > build.gradle

          echo ""
          echo "Downloading Gradle ${GRADLE_VERSION}..."

          curl \
            --fail \
            --location \
            --retry 3 \
            --output "gradle-${GRADLE_VERSION}-bin.zip" \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"

          echo ""
          echo "Extracting Gradle..."

          unzip -q \
            "gradle-${GRADLE_VERSION}-bin.zip"

          echo ""
          echo "Generating Gradle wrapper..."

          "./gradle-${GRADLE_VERSION}/bin/gradle" \
            wrapper \
            --gradle-version "${GRADLE_VERSION}" \
            --distribution-type bin \
            --no-daemon

          echo ""
          echo "Copying Gradle wrapper to Android project..."

          mkdir -p "${PROJECT_DIR}/android/gradle/wrapper"

          cp gradlew \
            "${PROJECT_DIR}/android/gradlew"

          cp gradlew.bat \
            "${PROJECT_DIR}/android/gradlew.bat"

          cp gradle/wrapper/gradle-wrapper.jar \
            "${PROJECT_DIR}/android/gradle/wrapper/gradle-wrapper.jar"

          cp gradle/wrapper/gradle-wrapper.properties \
            "${PROJECT_DIR}/android/gradle/wrapper/gradle-wrapper.properties"

          chmod +x "${PROJECT_DIR}/android/gradlew"

          echo ""
          echo "========================================"
          echo "GRADLE WRAPPER CREATED SUCCESSFULLY"
          echo "========================================"

          ls -lah "${PROJECT_DIR}/android"

          echo ""

          ls -lah \
            "${PROJECT_DIR}/android/gradle/wrapper"


      # ========================================
      # FIX AGP 9
      # ========================================

      - name: Fix AGP 9 compatibility
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "========================================"
          echo "PATCHING AGP CONFIGURATION"
          echo "========================================"

          touch android/gradle.properties

          echo ""
          echo "Removing android.newDsl..."

          sed -i \
            '/^[[:space:]]*android\.newDsl[[:space:]]*=/d' \
            android/gradle.properties

          echo ""
          echo "Setting Gradle to 8.9..."

          sed -i \
            's#^distributionUrl=.*#distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip#' \
            android/gradle/wrapper/gradle-wrapper.properties

          echo ""
          echo "Replacing AGP 9.x with AGP 8.7.3..."

          python3 <<'PYTHON'
          import os
          import re

          AGP_VERSION = "8.7.3"

          extensions = (
              ".gradle",
              ".gradle.kts",
              ".toml",
          )

          for root, dirs, files in os.walk("android"):

              for filename in files:

                  if not filename.endswith(extensions):
                      continue

                  path = os.path.join(root, filename)

                  with open(path, "r", encoding="utf-8") as f:
                      original = f.read()

                  text = original

                  # Traditional buildscript dependency
                  text = re.sub(
                      r'com\.android\.tools\.build:gradle:9\.[0-9.]+',
                      f'com.android.tools.build:gradle:{AGP_VERSION}',
                      text
                  )

                  # Kotlin DSL application plugin
                  text = re.sub(
                      r'(id\(\s*["\']com\.android\.application["\']\s*\)\s*version\s*["\'])9\.[0-9.]+',
                      rf'\g<1>{AGP_VERSION}',
                      text
                  )

                  # Kotlin DSL library plugin
                  text = re.sub(
                      r'(id\(\s*["\']com\.android\.library["\']\s*\)\s*version\s*["\'])9\.[0-9.]+',
                      rf'\g<1>{AGP_VERSION}',
                      text
                  )

                  # Groovy DSL application plugin
                  text = re.sub(
                      r'(id\s+["\']com\.android\.application["\']\s+version\s+["\'])9\.[0-9.]+',
                      rf'\g<1>{AGP_VERSION}',
                      text
                  )

                  # Groovy DSL library plugin
                  text = re.sub(
                      r'(id\s+["\']com\.android\.library["\']\s+version\s+["\'])9\.[0-9.]+',
                      rf'\g<1>{AGP_VERSION}',
                      text
                  )

                  # Version catalog AGP entry
                  text = re.sub(
                      r'(^\s*agp\s*=\s*["\'])9\.[0-9.]+',
                      rf'\g<1>{AGP_VERSION}',
                      text,
                      flags=re.MULTILINE
                  )

                  # Alternative variable
                  text = re.sub(
                      r'(^\s*androidGradlePlugin\s*=\s*["\'])9\.[0-9.]+',
                      rf'\g<1>{AGP_VERSION}',
                      text,
                      flags=re.MULTILINE
                  )

                  if text != original:

                      print(f"PATCHED: {path}")

                      with open(path, "w", encoding="utf-8") as f:
                          f.write(text)

          print("")
          print("AGP patch completed.")
          PYTHON


      # ========================================
      # VERIFY AGP
      # ========================================

      - name: Verify Android Gradle configuration
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "========================================"
          echo "GRADLE WRAPPER CONFIGURATION"
          echo "========================================"

          cat android/gradle/wrapper/gradle-wrapper.properties

          echo ""
          echo "========================================"
          echo "ANDROID GRADLE REFERENCES"
          echo "========================================"

          grep -Rni \
            -E \
            'com\.android\.application|com\.android\.library|com\.android\.tools\.build|androidGradlePlugin|agp[[:space:]]*=' \
            android \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            --include="*.toml" || true

          echo ""
          echo "========================================"
          echo "CHECKING FOR AGP 9"
          echo "========================================"

          if grep -Rni \
            -E \
            '(com\.android\.application|com\.android\.library|com\.android\.tools\.build:gradle|androidGradlePlugin|agp).*9\.' \
            android \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            --include="*.toml"; then

            echo ""
            echo "ERROR: AGP 9 reference still exists."
            exit 1

          fi

          echo ""
          echo "SUCCESS: No AGP 9 references found."


      # ========================================
      # VERIFY GRADLE
      # ========================================

      - name: Verify Gradle
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING GRADLE WRAPPER"
          echo "========================================"

          if [ ! -f "./gradlew" ]; then
            echo "ERROR: gradlew was not created."
            exit 1
          fi

          if [ ! -f "./gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "ERROR: gradle-wrapper.jar is missing."
            exit 1
          fi

          chmod +x ./gradlew

          echo ""
          echo "========================================"
          echo "GRADLE VERSION"
          echo "========================================"

          ./gradlew --version


      # ========================================
      # FLUTTER DEPENDENCIES
      # ========================================

      - name: Get Flutter dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "========================================"
          echo "GETTING FLUTTER DEPENDENCIES"
          echo "========================================"

          flutter clean

          rm -rf android/.gradle
          rm -rf .gradle

          flutter pub get


      # ========================================
      # BUILD APK
      # ========================================

      - name: Build Flutter APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "========================================"
          echo "BUILDING RELEASE APK"
          echo "========================================"

          flutter build apk \
            --release \
            --verbose


      # ========================================
      # SHOW APK
      # ========================================

      - name: Show generated APK files
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "========================================"
          echo "GENERATED APK FILES"
          echo "========================================"

          find build \
            -type f \
            -name "*.apk" \
            -print \
            -exec ls -lh {} \;


      # ========================================
      # UPLOAD APK
      # ========================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ycash-Wallet-Release-APK
          path: |
            ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/*.apk
            ${{ env.PROJECT_DIR }}/build/app/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
