name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract wallet project
        run: |
          echo "Repository contents:"
          ls -la

      - name: Find Flutter project
        id: flutter_project
        run: |
          if [ -f "pubspec.yaml" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          else
            PROJECT_DIR=$(find . -name pubspec.yaml -not -path "*/.pub-cache/*" -print -quit | xargs dirname)
            if [ -z "$PROJECT_DIR" ]; then
              echo "ERROR: Could not find pubspec.yaml"
              exit 1
            fi
            echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Show tool versions
        run: |
          flutter --version
          java -version
          javac -version

      - name: Get Flutter dependencies
        working-directory: ${{ steps.flutter_project.outputs.dir }}
        run: flutter pub get

      - name: Restore Android host if needed
        working-directory: ${{ steps.flutter_project.outputs.dir }}
        run: |
          if [ ! -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "Android host files are missing. Restoring them..."
            flutter create --platforms=android .
          else
            echo "Android host files already exist."
          fi

      - name: Build Android APK
        working-directory: ${{ steps.flutter_project.outputs.dir }}
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ycash-wallet-apk
          path: ${{ steps.flutter_project.outputs.dir }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
