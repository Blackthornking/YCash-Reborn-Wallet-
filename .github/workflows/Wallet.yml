name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract wallet project
        run: |
          echo "Repository contents:"
          ls -la

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          mkdir -p wallet_project
          unzip -q "$ZIP_FILE" -d wallet_project

          echo "Looking for Flutter project..."
          find wallet_project -maxdepth 5 -type f -name "pubspec.yaml"

      - name: Find Flutter project
        id: flutter_project
        run: |
          PROJECT_FILE=$(find wallet_project -type f -name pubspec.yaml -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: Could not find pubspec.yaml"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "Flutter project found at: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Show tool versions
        run: |
          flutter --version
          java -version
          javac -version

      - name: Restore Android host if needed
        working-directory: ${{ steps.flutter_project.outputs.dir }}
        run: |
          if [ ! -d "android" ]; then
            echo "Android directory is missing. Creating Android host..."
            flutter create --platforms=android .
          else
            echo "Android directory already exists."
          fi

      - name: Pin Android Gradle Plugin below AGP 9
        working-directory: ${{ steps.flutter_project.outputs.dir }}
        run: |
          echo "Checking Android Gradle configuration..."

          if [ -f "android/settings.gradle.kts" ]; then
            sed -i -E \
              's/(com\.android\.(application|library)".*version ")[^"]+/\18.7.3/g' \
              android/settings.gradle.kts || true
          fi

          if [ -f "android/settings.gradle" ]; then
            sed -i -E \
              's/(com\.android\.(application|library) version ")[^"]+/\18.7.3/g' \
              android/settings.gradle || true
          fi

          if [ -f "android/build.gradle" ]; then
            sed -i -E \
              "s/com\.android\.tools\.build:gradle:[0-9.]+/com.android.tools.build:gradle:8.7.3/g" \
              android/build.gradle || true
          fi

          if [ -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then
            sed -i -E \
              's/gradle-[0-9.]+-bin.zip/gradle-8.9-bin.zip/g' \
              android/gradle/wrapper/gradle-wrapper.properties
          fi

          echo "Android configuration:"
          find android -maxdepth 2 \( -name "settings.gradle" -o -name "settings.gradle.kts" -o -name "build.gradle" -o -name "build.gradle.kts" \) -print

      - name: Get Flutter dependencies
        working-directory: ${{ steps.flutter_project.outputs.dir }}
        run: flutter pub get

      - name: Clean previous build
        working-directory: ${{ steps.flutter_project.outputs.dir }}
        run: flutter clean

      - name: Build Android APK
        working-directory: ${{ steps.flutter_project.outputs.dir }}
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ycash-wallet-apk
          path: ${{ steps.flutter_project.outputs.dir }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
