name: Build Flutter Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository contents
        run: |
          echo "Repository root:"
          ls -la

      - name: Find and extract YCash wallet ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository root."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          rm -rf wallet_project
          mkdir -p wallet_project

          unzip -q "$ZIP_FILE" -d wallet_project

          echo "Extracted contents:"
          find wallet_project -maxdepth 3 -type f | head -50

      - name: Locate Flutter project
        id: project
        run: |
          PUBSPEC=$(find wallet_project -name pubspec.yaml -type f | head -n 1)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: Could not find pubspec.yaml inside extracted ZIP."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo "Flutter project found at: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          dart --version
          java -version

      - name: Verify Flutter project
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          test -f pubspec.yaml
          test -d android

          echo "Project contents:"
          ls -la

      - name: Get Flutter dependencies
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: flutter pub get

      - name: Analyze Flutter project
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: flutter test

      - name: Make Gradle wrapper executable
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          if [ -f android/gradlew ]; then
            chmod +x android/gradlew
          fi

      - name: Verify Gradle
        working-directory: ${{ steps.project.outputs.project_dir }}/android
        run: ./gradlew --version

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: flutter build apk --debug

      - name: Build release APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: flutter build apk --release

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Ycash-Wallet-Debug-APK
          path: ${{ steps.project.outputs.project_dir }}/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Ycash-Wallet-Release-APK
          path: ${{ steps.project.outputs.project_dir }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
