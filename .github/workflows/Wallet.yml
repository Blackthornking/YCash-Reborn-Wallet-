name: Build Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository contents
        run: |
          echo "Repository contents:"
          ls -lah

          echo ""
          echo "ZIP files:"
          find . -maxdepth 2 -type f -iname "*.zip" -print

      - name: Extract project ZIP
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "Using ZIP file: $ZIP_FILE"

          rm -rf extracted_project
          mkdir -p extracted_project

          unzip -q "$ZIP_FILE" -d extracted_project

          echo ""
          echo "Extracted project files:"
          find extracted_project -maxdepth 8 \
            -type f \
            \( \
              -name "pubspec.yaml" \
              -o -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              -o -name "build.gradle" \
              -o -name "build.gradle.kts" \
            \) \
            -print

      - name: Locate Flutter project
        run: |
          set -e

          PROJECT_DIR=$(find "$GITHUB_WORKSPACE/extracted_project" \
            -name pubspec.yaml \
            -type f \
            ! -path "*/packages/*" \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Could not find the main pubspec.yaml."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "Flutter project found at:"
          echo "$PROJECT_DIR"

          ls -lah "$PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865"

      - name: Configure Android environment
        run: |
          set -e

          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-linux-android
            armv7-linux-androideabi
            x86_64-linux-android

      - name: Install cargo-ndk
        run: |
          cargo install cargo-ndk --locked

      - name: Verify toolchains
        run: |
          echo "=== Java ==="
          java -version

          echo ""
          echo "=== Flutter ==="
          flutter --version

          echo ""
          echo "=== Rust ==="
          rustc --version
          cargo --version
          cargo ndk --version

          echo ""
          echo "=== Android SDK ==="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865"

      - name: Get Flutter dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter pub get

      - name: Check project structure
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=== Flutter project ==="
          ls -lah

          echo ""
          echo "=== Android Gradle files ==="
          find android -maxdepth 4 \
            -type f \
            \( \
              -name "*.gradle" \
              -o -name "*.gradle.kts" \
              -o -name "gradle.properties" \
              -o -name "gradle-wrapper.properties" \
            \) \
            -print

          echo ""
          echo "=== Rust project ==="

          if [ -d "packages/ycash_core_ffi/rust" ]; then
            find packages/ycash_core_ffi/rust \
              -maxdepth 2 \
              -type f \
              \( -name "Cargo.toml" -o -name "Cargo.lock" \) \
              -print
          else
            echo "Rust directory not found at expected path."
          fi

      - name: Fix AGP 9 incompatibility
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "========================================"
          echo "Checking current Android Gradle versions"
          echo "========================================"

          echo ""
          echo "--- Gradle files before patch ---"

          grep -R \
            -n \
            -E \
            'com\.android\.application|com\.android\.library|com\.android\.tools\.build:gradle|androidGradlePlugin' \
            android \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            --include="*.toml" || true

          echo ""
          echo "--- Gradle wrapper before patch ---"

          cat android/gradle/wrapper/gradle-wrapper.properties || true

          echo ""
          echo "========================================"
          echo "Removing AGP 9 newDsl configuration"
          echo "========================================"

          GRADLE_PROPERTIES="android/gradle.properties"

          touch "$GRADLE_PROPERTIES"

          sed -i \
            '/^[[:space:]]*android\.newDsl[[:space:]]*=/d' \
            "$GRADLE_PROPERTIES"

          echo ""
          echo "========================================"
          echo "Setting Gradle version to 8.10.2"
          echo "========================================"

          if [ -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then
            sed -i \
              's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.10.2-bin.zip#' \
              android/gradle/wrapper/gradle-wrapper.properties
          fi

          echo ""
          echo "========================================"
          echo "Replacing AGP 9 with AGP 8.8.2"
          echo "========================================"

          find android \
            -type f \
            \( \
              -name "*.gradle" \
              -o -name "*.gradle.kts" \
              -o -name "*.toml" \
            \) \
            -print0 | while IFS= read -r -d '' file; do

              echo "Checking: $file"

              sed -i -E \
                's/com\.android\.tools\.build:gradle:9\.[0-9.]+/com.android.tools.build:gradle:8.8.2/g' \
                "$file"

              sed -i -E \
                's/(com\.android\.application[[:space:]]*=[[:space:]]*")[^"]*9\.[0-9.]+/\18.8.2/g' \
                "$file"

              sed -i -E \
                's/(com\.android\.library[[:space:]]*=[[:space:]]*")[^"]*9\.[0-9.]+/\18.8.2/g' \
                "$file"

              sed -i -E \
                's/(id\(["'\'']com\.android\.application["'\'']\)[[:space:]]+version[[:space:]]+["'\''])9\.[0-9.]+/\18.8.2/g' \
                "$file"

              sed -i -E \
                's/(id\(["'\'']com\.android\.library["'\'']\)[[:space:]]+version[[:space:]]+["'\''])9\.[0-9.]+/\18.8.2/g' \
                "$file"

              sed -i -E \
                's/(id[[:space:]]+["'\'']com\.android\.application["'\''][[:space:]]+version[[:space:]]+["'\''])9\.[0-9.]+/\18.8.2/g' \
                "$file"

              sed -i -E \
                's/(id[[:space:]]+["'\'']com\.android\.library["'\''][[:space:]]+version[[:space:]]+["'\''])9\.[0-9.]+/\18.8.2/g' \
                "$file"

            done

          echo ""
          echo "========================================"
          echo "Final Android Gradle configuration"
          echo "========================================"

          echo ""
          echo "--- gradle.properties ---"
          cat "$GRADLE_PROPERTIES"

          echo ""
          echo "--- gradle-wrapper.properties ---"
          cat android/gradle/wrapper/gradle-wrapper.properties || true

          echo ""
          echo "--- AGP references after patch ---"

          grep -R \
            -n \
            -E \
            'com\.android\.application|com\.android\.library|com\.android\.tools\.build:gradle|androidGradlePlugin' \
            android \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            --include="*.toml" || true

          echo ""
          echo "--- Checking for remaining AGP 9 references ---"

          if grep -R \
            -n \
            -E \
            '(com\.android\.application|com\.android\.library).*9\.|com\.android\.tools\.build:gradle:9\.' \
            android \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            --include="*.toml"; then

            echo ""
            echo "ERROR: AGP 9 references are still present."
            exit 1
          fi

          echo ""
          echo "AGP compatibility patch completed successfully."

      - name: Clean Flutter and Gradle caches
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          flutter clean

          rm -rf android/.gradle
          rm -rf .gradle

          flutter pub get

      - name: Build Flutter APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter build apk \
            --release \
            --verbose

      - name: Show generated APK files
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "Generated APK files:"

          find build/app/outputs/flutter-apk \
            -type f \
            -name "*.apk" \
            -print \
            -exec ls -lh {} \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ycash-Wallet-Release-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30
